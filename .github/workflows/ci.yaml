name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  hallpass-py:
    # The engine: lint, types and the whole suite on the oldest and newest
    # Python it supports, on Linux and Windows; then the built wheels,
    # installed into a clean environment, tested from outside the checkout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet -e ".[crypto]" pytest pytest-timeout hypothesis ruff mypy types-PyYAML build
      - name: lint
        if: runner.os == 'Linux'
        run: |
          ruff format --check src tests examples
          ruff check src tests examples
      - name: types
        if: runner.os == 'Linux'
        run: mypy --strict src/hallpass
      - run: python -m pytest -q
      - name: the installed wheels
        if: runner.os == 'Linux'
        run: |
          set -eu
          python -m build -o /tmp/dist .
          python -m build -o /tmp/dist compat/hallpass-client
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet "$(ls /tmp/dist/hallpass-*.whl)[crypto]" pytest pytest-timeout hypothesis
          cp -r tests /tmp/wheel-tests
          (cd /tmp && HALLPASS_REQUIRE_INSTALLED=1 /tmp/clean/bin/python -m pytest -q -p no:cacheprovider --rootdir /tmp /tmp/wheel-tests)
          /tmp/clean/bin/pip install --quiet --no-deps /tmp/dist/hallpass_client-*.whl
          (cd /tmp && HALLPASS_SDK_REQUIRE_INSTALLED=1 /tmp/clean/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/hallpass-py/compat/hallpass-client/tests" -v)

  specs:
    # The integration suites with every fake upstream validating requests
    # against the vendor's published API description, and the vendor mocks
    # (Prism) answering from those descriptions.
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .specs
          key: api-specs-${{ github.run_id }}
          restore-keys: api-specs-
      - name: fetch API descriptions
        run: test/specs/fetch.sh .specs
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]" pytest pytest-timeout hypothesis
      - name: requests against the descriptions
        working-directory: hallpass-py
        run: HALLPASS_SPECS_DIR=$GITHUB_WORKSPACE/.specs python -m pytest -q tests/integrations tests/harness_tests
      - run: npx --yes @stoplight/prism-cli@5 --version
      - name: contract (Prism)
        working-directory: hallpass-py
        run: HALLPASS_SPECS_DIR=$GITHUB_WORKSPACE/.specs python -m pytest -v tests/contract

  frameworks:
    # Each agent framework's real agent loop with a scripted model, against
    # a real Vault in docker; with the ANTHROPIC_API_KEY secret set, also
    # against a real Claude model.
    runs-on: ubuntu-latest
    needs: hallpass-py
    strategy:
      fail-fast: false
      matrix:
        include:
          - {extra: strands, test: strands, live: "strands-agents[anthropic]"}
          - {extra: langchain, test: langchain, live: "langchain-anthropic"}
          - {extra: mcp, test: mcp, live: "anthropic uvicorn"}
          - {extra: openai-agents, test: openai_agents, live: ""}
          - {extra: claude-agent-sdk, test: claude_agent_sdk, live: ""}
          - {extra: google-adk, test: google_adk, live: "anthropic"}
          - {extra: pydantic-ai, test: pydantic_ai, live: "pydantic-ai-slim[anthropic]"}
          - {extra: crewai, test: crewai, live: "crewai[anthropic]"}
          - {extra: llamaindex, test: llamaindex, live: "llama-index-llms-anthropic"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: docker pull hashicorp/vault:1.17
      - run: python -m pip install --quiet -e "./hallpass-py[crypto,${{ matrix.extra }}]" ${{ matrix.live }} pytest pytest-timeout hypothesis
      - working-directory: hallpass-py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HALLPASS_REAL: "1"
        run: python -m pytest -v tests/frameworks/test_${{ matrix.test }}.py

  real:
    # The vault integration against a real Vault server: every case checked
    # against Vault's own sys/capabilities answer.
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: docker pull hashicorp/vault:1.17
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]" pytest pytest-timeout hypothesis
      - working-directory: hallpass-py
        run: HALLPASS_REAL=1 python -m pytest -v tests/real

  clients:
    # The TypeScript client (npm hallpass-client): built, tested, packed and
    # installed into an empty project; the TypeScript agent examples; and
    # the docs' links.
    runs-on: ubuntu-latest
    needs: hallpass-py
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: build and test
        working-directory: hallpass-ts
        run: |
          npm ci
          npm test
      - name: test the packed tarball
        run: |
          set -eu
          mkdir /tmp/consumer
          (cd hallpass-ts && npm pack --pack-destination /tmp/consumer)
          cp hallpass-ts/test/package.test.mjs /tmp/consumer/
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./hallpass-client-*.tgz
          HALLPASS_SDK_PACKED=1 node --test package.test.mjs
      - name: agent examples (TypeScript)
        if: matrix.node == 22
        working-directory: examples/agent-ts
        run: |
          npm ci
          npm test
      - name: docs links
        if: matrix.node == 22
        run: python3 test/docs/linkcheck.py

  kind:
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: helm/kind-action@v1
        with:
          cluster_name: hallpass-e2e
          install_only: true
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]" pytest pytest-timeout hypothesis
      - name: kubernetes end to end
        run: KEEP=1 test/kind/run.sh
      - name: helm chart on the cluster
        run: KEEP=1 test/kind/helm.sh

  helm:
    # Lints and renders the chart, then loads the rendered config with the
    # real program so a chart change cannot ship a hallpass.yaml that does
    # not parse.
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v4
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]"
      - run: helm lint deploy/helm/hallpass --strict --set apiKey.value=x
      - run: helm template hallpass deploy/helm/hallpass --set apiKey.value=x > /dev/null
      - name: rendered config loads
        run: |
          set -eu
          helm template hallpass deploy/helm/hallpass --set apiKey.value=x -s templates/configmap.yaml \
            | sed -n '/hallpass.yaml: |/,$p' | tail -n +2 | sed 's/^    //' > /tmp/rendered.yaml
          HALLPASS_API_KEY=x hallpass validate -config /tmp/rendered.yaml
      - name: values combinations that must fail
        run: |
          set -eu
          if helm template hallpass deploy/helm/hallpass > /dev/null 2>&1; then
            echo "rendered without an API key"; exit 1; fi
          if helm template hallpass deploy/helm/hallpass --set apiKey.value=x --set apiKey.existingSecret=y > /dev/null 2>&1; then
            echo "rendered with both apiKey.value and apiKey.existingSecret"; exit 1; fi

  fuzz:
    # Long property-based runs of every parser, on the nightly schedule only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]" pytest pytest-timeout hypothesis
      - working-directory: hallpass-py
        run: HYPOTHESIS_PROFILE=nightly HALLPASS_FUZZ_SCALE=40 python -m pytest -q -p no:cacheprovider tests/core/test_catalog.py tests/integrations -k "fuzz or property or hypothesis"

  differential:
    # Compares the Argo CD RBAC evaluator with the real argocd CLI.
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install argocd cli
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd version --client
      - run: python -m pip install --quiet -e "./hallpass-py[crypto]" pytest pytest-timeout hypothesis
      - working-directory: hallpass-py
        run: python -m pytest -v tests/differential

  docker:
    runs-on: ubuntu-latest
    needs: hallpass-py
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hallpass:ci .
      - name: smoke
        run: |
          set -eu
          docker run -d --name hp -p 8080:8080 --read-only --user 65532:65532 -e HALLPASS_API_KEY=ci-key \
            -v "$PWD/examples/hallpass.yaml:/etc/hallpass/hallpass.yaml:ro" hallpass:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -X POST http://localhost:8080/check -H 'Authorization: Bearer ci-key' \
            -H 'Content-Type: application/json' \
            -d '{"user":"admin@example.com","connection":"demo","action":"thing.write","resource":"thing:1"}' | grep '"allow"'
          curl -fsS -X POST http://localhost:8080/check -H 'Authorization: Bearer ci-key' \
            -H 'Content-Type: application/json' \
            -d '{"user":"dana@example.com","connection":"demo","action":"thing.write","resource":"thing:1"}' | grep '"deny"'
          docker rm -f hp
