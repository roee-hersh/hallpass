name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go vet -tags "e2e differential live contract" ./test/...
      - run: go test -race -count=1 ./...
      - run: go build -o /dev/null ./cmd/hallpass
        if: runner.os == 'Linux'
      - name: agent example
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet -r examples/agent/requirements.txt
          HALLPASS_EXAMPLE_REQUIRE_DEPS=1 python3 -m unittest discover -s examples/agent -v

  specs:
    # Runs the integration suites with every fake upstream validating requests
    # against the vendor's published API description.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .specs
          key: api-specs-${{ github.run_id }}
          restore-keys: api-specs-
      - name: fetch API descriptions
        run: test/specs/fetch.sh .specs
      - name: test against the descriptions
        run: HALLPASS_SPECS_DIR=$PWD/.specs go test -race -count=1 ./internal/integrations/...

  contract:
    # Integrations against Prism, a mock server answering from the vendor's
    # OpenAPI description with request validation.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .specs
          key: api-specs-${{ github.run_id }}
          restore-keys: api-specs-
      - run: test/specs/fetch.sh .specs
      - run: npx --yes @stoplight/prism-cli@5 --version
      - run: HALLPASS_SPECS_DIR=$PWD/.specs go test -tags contract -count=1 -v ./test/contract/

  kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: hallpass-e2e
          install_only: true
      - name: kubernetes end to end
        run: KEEP=1 test/kind/run.sh
      - name: helm chart on the cluster
        run: KEEP=1 test/kind/helm.sh

  helm:
    # Lints and renders the chart, then loads the rendered config with the
    # real binary so a chart change cannot ship a hallpass.yaml that does
    # not parse.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/hallpass --strict --set apiKey.value=x
      - run: helm template hallpass deploy/helm/hallpass --set apiKey.value=x > /dev/null
      - name: rendered config loads
        run: |
          set -eu
          helm template hallpass deploy/helm/hallpass --set apiKey.value=x -s templates/configmap.yaml \
            | sed -n '/hallpass.yaml: |/,$p' | tail -n +2 | sed 's/^    //' > /tmp/rendered.yaml
          HALLPASS_API_KEY=x go run ./cmd/hallpass validate -config /tmp/rendered.yaml
      - name: values combinations that must fail
        run: |
          set -eu
          if helm template hallpass deploy/helm/hallpass > /dev/null 2>&1; then
            echo "rendered without an API key"; exit 1; fi
          if helm template hallpass deploy/helm/hallpass --set apiKey.value=x --set apiKey.existingSecret=y > /dev/null 2>&1; then
            echo "rendered with both apiKey.value and apiKey.existingSecret"; exit 1; fi

  fuzz:
    # Short fuzz runs of every parser, on the nightly schedule only.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz='^FuzzParseResource$' -fuzztime=60s ./internal/catalog/
      - run: go test -run '^$' -fuzz='^FuzzValidateActionName$' -fuzztime=30s ./internal/catalog/
      - run: go test -run '^$' -fuzz='^FuzzBuildAttributes$' -fuzztime=60s ./internal/integrations/kubernetes/
      - run: go test -run '^$' -fuzz='^FuzzBuildRequest$' -fuzztime=60s ./internal/integrations/argocd/
      - run: go test -run '^$' -fuzz='^FuzzGlob$' -fuzztime=60s ./internal/integrations/argocd/
      - run: go test -run '^$' -fuzz='^FuzzParseTarget$' -fuzztime=60s ./internal/integrations/gitlab/
      - run: go test -run '^$' -fuzz='^FuzzParseTarget$' -fuzztime=60s ./internal/integrations/github/
      - run: go test -run '^$' -fuzz='^FuzzParseResource$' -fuzztime=30s ./internal/integrations/jira/
      - run: go test -run '^$' -fuzz='^FuzzParseResource$' -fuzztime=30s ./internal/integrations/confluence/
      - run: go test -run '^$' -fuzz='^FuzzValidateResource$' -fuzztime=30s ./internal/integrations/slack/
      - run: go test -run '^$' -fuzz='^FuzzParseResource$' -fuzztime=60s ./internal/integrations/aws/
      - run: go test -run '^$' -fuzz='^FuzzParseTarget$' -fuzztime=60s ./internal/integrations/salesforce/
      - run: go test -run '^$' -fuzz='^FuzzSOQLString$' -fuzztime=60s ./internal/integrations/salesforce/
      - run: go test -run '^$' -fuzz='^FuzzParseRef$' -fuzztime=60s ./internal/integrations/googleworkspace/
      - run: go test -run '^$' -fuzz='^FuzzParseRef$' -fuzztime=60s ./internal/integrations/googlecloud/
      - run: go test -run '^$' -fuzz='^FuzzParseRef$' -fuzztime=60s ./internal/integrations/microsoft365/
      - run: go test -run '^$' -fuzz='^FuzzODataString$' -fuzztime=30s ./internal/integrations/microsoft365/
      - run: go test -run '^$' -fuzz='^FuzzParseTarget$' -fuzztime=60s ./internal/integrations/azure/

  differential:
    # Compares the Argo CD RBAC evaluator with the real argocd CLI.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install argocd cli
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd version --client
      - run: go test -tags differential -count=1 -v ./test/differential/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hallpass:ci .
      - name: smoke
        run: |
          set -eu
          docker run -d --name hp -p 8080:8080 -e HALLPASS_API_KEY=ci-key \
            -v "$PWD/examples/hallpass.yaml:/etc/hallpass/hallpass.yaml:ro" hallpass:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -X POST http://localhost:8080/check -H 'Authorization: Bearer ci-key' \
            -H 'Content-Type: application/json' \
            -d '{"user":"admin@example.com","connection":"demo","action":"thing.write","resource":"thing:1"}' | grep '"allow"'
          curl -fsS -X POST http://localhost:8080/check -H 'Authorization: Bearer ci-key' \
            -H 'Content-Type: application/json' \
            -d '{"user":"dana@example.com","connection":"demo","action":"thing.write","resource":"thing:1"}' | grep '"deny"'
          docker rm -f hp
