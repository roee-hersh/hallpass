name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0. Tags the head of main.
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  tag:
    # A manual run creates the tag first. A tag pushed with GITHUB_TOKEN does
    # not start this workflow again, so each release runs once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version: $VERSION"; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo "run this from main"; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "hallpass $VERSION"
          git push origin "refs/tags/$VERSION"

  binaries:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sdk:
    # Attaches both client packages to the GitHub release, under fixed names
    # so the install commands in the docs always get the latest release:
    #   hallpass-client-python.tar.gz  (pip install <url>)
    #   hallpass-client-node.tgz       (npm install <url>)
    # plus the versioned wheel and sdk-checksums.txt. Needs no registry
    # account; the pypi and npm jobs below publish to the registries later.
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: |
          set -eu
          v="${VERSION#v}"
          mkdir out npmdist
          sed -i "s/^version = \"0.0.0\"$/version = \"$v\"/" sdk/python/pyproject.toml
          grep -q "^version = \"$v\"$" sdk/python/pyproject.toml
          python -m pip install --quiet build
          python -m build sdk/python -o pydist
          cp pydist/*.whl out/
          cp pydist/*.tar.gz out/hallpass-client-python.tar.gz
          cd sdk/node
          npm ci
          npm version --no-git-tag-version "$v"
          npm test
          npm pack --pack-destination ../../npmdist
          cd ../..
          cp npmdist/*.tgz out/hallpass-client-node.tgz
          (cd out && sha256sum * > sdk-checksums.txt)
          cat out/sdk-checksums.txt
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" out/* --clobber

  pypi:
    # Publishes sdk/python as hallpass-client with PyPI trusted publishing
    # (no stored token). Runs once the repository variable PUBLISH_PYPI is
    # "true", after the publisher is registered on PyPI; see sdk/README.md.
    needs: tag
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build
        run: |
          set -eu
          v="${VERSION#v}"
          sed -i "s/^version = \"0.0.0\"$/version = \"$v\"/" sdk/python/pyproject.toml
          grep -q "^version = \"$v\"$" sdk/python/pyproject.toml
          python -m pip install --quiet build
          python -m build sdk/python -o dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Publishes sdk/node as hallpass-client with npm trusted publishing and
    # provenance. Runs once the repository variable PUBLISH_NPM is "true";
    # see sdk/README.md.
    needs: tag
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish
        working-directory: sdk/node
        env:
          # Only for the very first publish, before the package exists and
          # trusted publishing can be set up; delete the secret afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          npm install --global npm@^11.5.1
          npm ci
          npm version --no-git-tag-version "${VERSION#v}"
          npm test
          case "${VERSION#v}" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
