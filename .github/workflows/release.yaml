name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0. Tags the head of main.
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  tag:
    # A manual run creates the tag first. A tag pushed with GITHUB_TOKEN does
    # not start this workflow again, so each release runs once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version: $VERSION"; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo "run this from main"; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "hallpass $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: create release
        # The GitHub release the assets job uploads to, with notes generated
        # from the merged pull requests. A version with a suffix (v1.2.3-rc.1)
        # is a prerelease.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "release $VERSION exists"
            exit 0
          fi
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" --verify-tag --title "hallpass $VERSION" --generate-notes $pre

  image:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    # Publishes the Helm chart to oci://ghcr.io/<owner>/charts/hallpass with
    # the release version as both the chart version and appVersion, so each
    # chart version deploys the image of the same version.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: azure/setup-helm@v4
      - name: package and push
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          v="${VERSION#v}"
          helm lint deploy/helm/hallpass --strict --set apiKey.value=x
          helm package deploy/helm/hallpass --version "$v" --app-version "$v" -d out
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "out/hallpass-$v.tgz" "oci://ghcr.io/${OWNER,,}/charts"

  assets:
    # Attaches the packages to the GitHub release as a registry-free copy
    # (pip install <url>, npm install <url>), under fixed names so
    # releases/latest/download/... works: hallpass-python.tar.gz and
    # hallpass-client-node.tgz, plus the versioned wheel and checksums.txt. The docs install from PyPI and npm,
    # which the pypi and npm jobs below publish to.
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: |
          set -eu
          mkdir out npmdist
          .github/scripts/build-python.sh "${VERSION#v}" pydist
          cp pydist/*.whl out/
          cp pydist/hallpass-[0-9]*.tar.gz out/hallpass-python.tar.gz
          cd hallpass-ts
          npm ci
          npm version --no-git-tag-version "${VERSION#v}"
          npm test
          npm pack --pack-destination ../npmdist
          cd ..
          cp npmdist/*.tgz out/hallpass-client-node.tgz
          (cd out && sha256sum * > checksums.txt)
          cat out/checksums.txt
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" out/* --clobber

  pypi:
    # Publishes hallpass (hallpass-py) with PyPI trusted publishing (no
    # stored token). Runs once the repository variable PUBLISH_PYPI is
    # "true", after the publisher is registered on PyPI; see
    # hallpass-py/RELEASING.md.
    needs: tag
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: .github/scripts/build-python.sh "${VERSION#v}" dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # Publishes hallpass-ts as hallpass-client with npm trusted publishing
    # (OpenID Connect, no stored token) and provenance. Runs when the
    # repository variable PUBLISH_NPM is "true"; see hallpass-py/RELEASING.md.
    needs: tag
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish
        working-directory: hallpass-ts
        run: |
          set -eu
          npm install --global npm@^11.5.1
          npm ci
          npm version --no-git-tag-version "${VERSION#v}"
          npm test
          case "${VERSION#v}" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
