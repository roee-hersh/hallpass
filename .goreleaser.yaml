version: 2

builds:
  - main: ./cmd/hallpass
    binary: hallpass
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, examples/hallpass.yaml]

checksum:
  name_template: checksums.txt

changelog:
  use: github
