{{- if .Values.rbac.subjectAccessReview.create -}}
# The one permission hallpass needs to answer questions about this cluster:
# create SubjectAccessReviews. They are never persisted; creating one only asks
# the API server "may this subject do that?".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hallpass.fullname" . }}-subjectaccessreview
  labels:
    {{- include "hallpass.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hallpass.fullname" . }}-subjectaccessreview
  labels:
    {{- include "hallpass.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hallpass.fullname" . }}-subjectaccessreview
subjects:
  - kind: ServiceAccount
    name: {{ include "hallpass.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
