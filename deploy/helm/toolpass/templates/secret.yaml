{{- include "toolpass.validate" . -}}
{{- if .Values.apiKey.value -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toolpass.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolpass.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.key }}: {{ .Values.apiKey.value | quote }}
{{- end }}
