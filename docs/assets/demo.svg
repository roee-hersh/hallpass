<rect width="860" height="444" rx="10" fill="#0d1117"/>
<rect width="860" height="32" rx="10" fill="#161b22"/><rect y="22" width="860" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="430.0" y="20" text-anchor="middle" fill="#8b949e">hallpass</text>
<text class="l0" x="20" y="58" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">hallpass validate -config hallpass.yaml</tspan></text>
<text class="l1" x="20" y="80" xml:space="preserve"><tspan fill="#8b949e">hallpass.yaml: ok, 1 connection(s)</tspan></text>
<text class="l2" x="20" y="102" xml:space="preserve"><tspan fill="#8b949e">  demo                     fake</tspan></text>
<text class="l3" x="20" y="124" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">hallpass serve -config hallpass.yaml &amp;</tspan></text>
<text class="l4" x="20" y="146" xml:space="preserve"><tspan fill="#8b949e">{&quot;level&quot;:&quot;INFO&quot;,&quot;msg&quot;:&quot;listening&quot;,&quot;addr&quot;:&quot;:8080&quot;,&quot;connections&quot;:1}</tspan></text>
<text class="l5" x="20" y="168" xml:space="preserve"><tspan fill="#8b949e">{&quot;level&quot;:&quot;INFO&quot;,&quot;msg&quot;:&quot;probe ok&quot;,&quot;connection&quot;:&quot;demo&quot;,&quot;integration&quot;:&quot;fake&quot;}</tspan></text>
<text class="l6" x="20" y="190" xml:space="preserve"><tspan fill="#d29922"># the admin asks the agent to change thing:1. May they?</tspan></text>
<text class="l7" x="20" y="212" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">curl localhost:8080/check -H &quot;Authorization: Bearer $KEY&quot; -d &#x27;{</tspan></text>
<text class="l8" x="20" y="234" xml:space="preserve"><tspan fill="#e6edf3">    &quot;user&quot;:&quot;admin@example.com&quot;,&quot;connection&quot;:&quot;demo&quot;,</tspan></text>
<text class="l9" x="20" y="256" xml:space="preserve"><tspan fill="#e6edf3">    &quot;action&quot;:&quot;thing.write&quot;,&quot;resource&quot;:&quot;thing:1&quot;}&#x27;</tspan></text>
<text class="l10" x="20" y="278" xml:space="preserve"><tspan fill="#e6edf3">{&quot;decision&quot;:</tspan><tspan fill="#3fb950">&quot;allow&quot;</tspan><tspan fill="#e6edf3">,&quot;reason&quot;:&quot;allowed: admin@example.com is an admin&quot;}</tspan></text>
<text class="l11" x="20" y="300" xml:space="preserve"><tspan fill="#d29922"># dana asks for the same thing</tspan></text>
<text class="l12" x="20" y="322" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">curl ... &#x27;{&quot;user&quot;:&quot;dana@example.com&quot;, ... }&#x27;</tspan></text>
<text class="l13" x="20" y="344" xml:space="preserve"><tspan fill="#e6edf3">{&quot;decision&quot;:</tspan><tspan fill="#f85149">&quot;deny&quot;</tspan><tspan fill="#e6edf3">,&quot;reason&quot;:&quot;denied: dana@example.com is not an admin&quot;}</tspan></text>
<text class="l14" x="20" y="366" xml:space="preserve"><tspan fill="#d29922"># someone with no account in that system</tspan></text>
<text class="l15" x="20" y="388" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">curl ... &#x27;{&quot;user&quot;:&quot;ghost@example.com&quot;, ... }&#x27;</tspan></text>
<text class="l16" x="20" y="410" xml:space="preserve"><tspan fill="#e6edf3">{&quot;decision&quot;:</tspan><tspan fill="#f85149">&quot;deny&quot;</tspan><tspan fill="#e6edf3">,&quot;reason&quot;:&quot;user_not_found: no account for ghost@example.com&quot;}</tspan></text>
</svg>
