[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hallpass-client"
# The release workflow sets the version from the release tag before it builds.
version = "0.0.0"
description = "Compatibility package: hallpass-client is now part of hallpass. Re-exports the hallpass client and Strands handler."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The release sets both versions from the tag, so the two stay in step.
dependencies = ["hallpass==0.0.0"]
keywords = ["ai-agents", "authorization", "permissions", "llm", "tools", "mcp", "strands-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
# hallpass_client.strands, the intervention handler. Strands needs Python 3.10+;
# on 3.9 the extra installs nothing and importing the module says why.
strands = ["hallpass[strands]==0.0.0"]

[project.urls]
Homepage = "https://github.com/roee-hersh/hallpass"
Documentation = "https://github.com/roee-hersh/hallpass/blob/main/docs/guides/agent-tools.md"
Issues = "https://github.com/roee-hersh/hallpass/issues"
Source = "https://github.com/roee-hersh/hallpass/tree/main/hallpass-py/compat/hallpass-client"

[tool.hatch.build.targets.wheel]
packages = ["src/hallpass_client"]

[tool.hatch.build.targets.sdist]
include = ["src/hallpass_client", "tests", "README.md", "LICENSE"]
