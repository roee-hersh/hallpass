# The azure integration: role assignments, deny assignments, management
# groups, ABAC conditions, Graph user resolution and ARM failures, against a
# static fake of Entra's token endpoint, Microsoft Graph and ARM. The fake
# ignores assignedTo() and query strings: every scope answers the same
# listing for every user, and Graph returns every user for any filter (the
# connection keeps only exact mail/UPN matches).
connections:
  - id: az
    integration: azure
    tenant_id: 11111111-1111-1111-1111-111111111111
    client_id: 22222222-2222-2222-2222-222222222222
    credential: env:AZ_SECRET
    url: "{{url}}"
    graph_url: "{{url}}"
    authority_url: "{{url}}"
    ca_file: "{{ca_file}}"
  - id: az-rejected
    integration: azure
    tenant_id: 44444444-4444-4444-4444-444444444444
    client_id: 22222222-2222-2222-2222-222222222222
    credential: env:AZ_SECRET
    url: "{{url}}"
    graph_url: "{{url}}"
    authority_url: "{{url}}"
    ca_file: "{{ca_file}}"
env:
  AZ_SECRET: parity-azure-secret
upstream:
  - method: POST
    path: /11111111-1111-1111-1111-111111111111/oauth2/v2.0/token
    json: {token_type: Bearer, expires_in: 3599, access_token: parity-token}
  - method: POST
    path: /44444444-4444-4444-4444-444444444444/oauth2/v2.0/token
    status: 401
    json: {error: invalid_client, error_description: bad secret}
  - method: GET
    path: /v1.0/users
    json:
      value:
        - {id: aaaaaaaa-0000-0000-0000-000000000001, mail: dana@example.com, userPrincipalName: dana@corp.example, accountEnabled: true}
        - {id: aaaaaaaa-0000-0000-0000-000000000009, mail: dana@example.com.au, userPrincipalName: danaau@corp.example, accountEnabled: true}
        - {id: aaaaaaaa-0000-0000-0000-000000000004, mail: off@example.com, userPrincipalName: off@corp.example, accountEnabled: false}
        - {id: aaaaaaaa-0000-0000-0000-000000000006, mail: quiet@example.com, userPrincipalName: quiet@corp.example}
        - {id: AAAAAAAA-0000-0000-0000-000000000007, mail: upper@example.com, accountEnabled: true}
        - {id: not-an-object-id, mail: weird@example.com, accountEnabled: true}
        - {id: aaaaaaaa-0000-0000-0000-0000000000d1, mail: dup@example.com, accountEnabled: true}
        - {id: aaaaaaaa-0000-0000-0000-0000000000d2, userPrincipalName: DUP@example.com, accountEnabled: true}

  # resourcegroup prod: Reader at the subscription, VM Operator through a group at prod.
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Authorization/roleAssignments
    json:
      value:
        - id: /subscriptions/33333333-3333-3333-3333-333333333333/providers/Microsoft.Authorization/roleAssignments/ra-1
          properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/acdd72a7-3385-48ef-bd42-f606fba81ae7
            principalId: aaaaaaaa-0000-0000-0000-000000000001
            principalType: User
        - id: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Authorization/roleAssignments/ra-2
          properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod
            roleDefinitionId: /subscriptions/33333333-3333-3333-3333-333333333333/providers/Microsoft.Authorization/roleDefinitions/cccccccc-0000-0000-0000-000000000001
            principalId: bbbbbbbb-0000-0000-0000-000000000001
            principalType: Group
        - id: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/other/providers/Microsoft.Authorization/roleAssignments/ra-below
          properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/other
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
            principalId: aaaaaaaa-0000-0000-0000-000000000001
            principalType: User
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Authorization/roleDefinitions/acdd72a7-3385-48ef-bd42-f606fba81ae7
    json:
      id: /providers/Microsoft.Authorization/roleDefinitions/acdd72a7-3385-48ef-bd42-f606fba81ae7
      properties:
        roleName: Reader
        type: BuiltInRole
        permissions: [{actions: ["*/read"], notActions: [], dataActions: [], notDataActions: []}]
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Authorization/roleDefinitions/cccccccc-0000-0000-0000-000000000001
    json:
      id: /subscriptions/33333333-3333-3333-3333-333333333333/providers/Microsoft.Authorization/roleDefinitions/cccccccc-0000-0000-0000-000000000001
      properties:
        roleName: VM Operator
        type: CustomRole
        permissions: [{actions: ["Microsoft.Compute/virtualMachines/start/action", "Microsoft.Compute/*/read"], notActions: []}]
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Authorization/denyAssignments
    json:
      value:
        - id: /subscriptions/33333333-3333-3333-3333-333333333333/providers/Microsoft.Authorization/denyAssignments/da-exact
          properties:
            denyAssignmentName: no-start-sub-exact
            scope: /subscriptions/33333333-3333-3333-3333-333333333333
            doNotApplyToChildScopes: true
            permissions: [{actions: ["Microsoft.Compute/virtualMachines/start/action"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]

  # resourcegroup locked: Contributor at the subscription, a deny on delete at locked.
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked/providers/Microsoft.Authorization/roleAssignments
    json:
      value:
        - properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
            principalId: aaaaaaaa-0000-0000-0000-000000000001
            principalType: User
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
    json:
      id: /providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
      properties:
        roleName: Contributor
        type: BuiltInRole
        permissions:
          - actions: ["*"]
            notActions: ["Microsoft.Authorization/*/Delete", "Microsoft.Authorization/*/Write", "Microsoft.Authorization/elevateAccess/Action"]
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked/providers/Microsoft.Authorization/denyAssignments
    json:
      value:
        - properties:
            denyAssignmentName: no-delete-locked
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked
            permissions: [{actions: ["Microsoft.Compute/virtualMachines/delete", "Microsoft.Resources/subscriptions/resourceGroups/delete"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]
        - properties:
            denyAssignmentName: no-listkeys-except-group
            scope: /subscriptions/33333333-3333-3333-3333-333333333333
            permissions: [{actions: ["Microsoft.Storage/storageAccounts/listkeys/action"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]
            excludePrincipals: [{id: bbbbbbbb-0000-0000-0000-000000000002, type: Group}]
        - properties:
            denyAssignmentName: cond-deny
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked
            condition: "@Resource[Microsoft.Compute/virtualMachines:name] StringEquals 'x'"
            permissions: [{actions: ["Microsoft.Compute/virtualMachines/deallocate/action"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]
        - properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked
            permissions: [{actions: ["Microsoft.Compute/virtualMachines/restart/action"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]
        - properties:
            denyAssignmentName: no-redeploy-except-dana
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked
            permissions: [{actions: ["Microsoft.Resources/deployments/write"]}]
            principals: [{id: 00000000-0000-0000-0000-000000000000, type: SystemDefined}]
            excludePrincipals: [{id: AAAAAAAA-0000-0000-0000-000000000001, type: User}]

  # resourcegroup cond: an assignment with an ABAC condition only.
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/cond/providers/Microsoft.Authorization/roleAssignments
    json:
      value:
        - properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/cond
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
            principalId: aaaaaaaa-0000-0000-0000-000000000001
            principalType: User
            condition: "@Resource[Microsoft.Storage/storageAccounts/blobServices/containers:name] StringEquals 'x'"
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/cond/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
    json:
      properties: {roleName: Owner, permissions: [{actions: ["*"], dataActions: ["*"]}]}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/cond/providers/Microsoft.Authorization/denyAssignments
    json: {value: []}

  # management groups: Owner at corp.
  - method: GET
    path: /providers/Microsoft.Management/managementGroups/*
    json:
      value:
        - properties:
            scope: /providers/Microsoft.Management/managementGroups/corp
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
            principalId: aaaaaaaa-0000-0000-0000-000000000001
            principalType: User
  - method: GET
    path: /providers/Microsoft.Management/managementGroups/corp/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
    json:
      properties: {roleName: Owner, permissions: [{actions: ["*"]}]}
  - method: GET
    path: /providers/Microsoft.Management/managementGroups/other-mg/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
    json:
      id: /providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
      properties: {permissions: [{actions: ["*"]}]}
  - method: GET
    path: /providers/Microsoft.Management/managementGroups/corp/providers/Microsoft.Authorization/denyAssignments
    json: {value: []}
  - method: GET
    path: /providers/Microsoft.Management/managementGroups/other-mg/providers/Microsoft.Authorization/denyAssignments
    json: {value: []}

  # resourcegroup empty: no assignment at all.
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/empty/*
    json: {value: []}

  # failures and odd answers.
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/hidden/*
    status: 403
    json: {error: {code: AuthorizationFailed, message: no}}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/forbid/*
    status: 403
    body: '{"error": {"code": "LinkedAuthorizationFailed", "message": "no"}}'
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/badreq/*
    status: 400
    json: {error: {code: InvalidFilter}}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/badreq2/*
    status: 400
    body: 'not json at all'
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/boom/*
    status: 500
    json: {error: {code: InternalServerError}}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/unauth/*
    status: 401
    json: {error: {code: InvalidAuthenticationToken}}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/junk/*
    body: 'this is not json'
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/wrongtype/*
    json: {value: {not: a list}}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/baditem/*
    json: {value: [{properties: {scope: 7}}]}
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/evil/*
    json:
      value: []
      nextLink: https://evil.example.com/subscriptions/x/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/norole/providers/Microsoft.Authorization/roleAssignments
    json:
      value:
        - properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/norole
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/dddddddd-0000-0000-0000-000000000001
            principalId: aaaaaaaa-0000-0000-0000-000000000001
  - method: GET
    path: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/oddrole/providers/Microsoft.Authorization/roleAssignments
    json:
      value:
        - properties:
            scope: /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/oddrole
            roleDefinitionId: /providers/Microsoft.Authorization/roleDefinitions/not-a-guid
checks:
  # Grants, inherited and through groups.
  - {user: dana@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: allowed, reason: "allowed: role \"Reader\" assigned directly at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Compute/virtualMachines/read to dana@example.com"}
  - {user: DANA@Example.com, action: vm.start, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: allowed, reason: "allowed: role \"VM Operator\" assigned through group bbbbbbbb-0000-0000-0000-000000000001 at /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod grants Microsoft.Compute/virtualMachines/start/action to dana@example.com"}
  - {user: dana@corp.example, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: allowed, reason: "allowed: role \"Reader\" assigned directly at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Compute/virtualMachines/read to dana@corp.example"}
  - {user: upper@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: allowed, reason: "allowed: role \"Reader\" assigned through user aaaaaaaa-0000-0000-0000-000000000001 at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Compute/virtualMachines/read to upper@example.com"}
  - {user: dana@example.com, action: "raw:Microsoft.Network/publicIPAddresses/read", resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: allowed, reason: "allowed: role \"Reader\" assigned directly at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Network/publicIPAddresses/read to dana@example.com"}
  - {user: dana@example.com, action: vm.delete, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: denied, reason: "denied: none of dana@example.com's 2 role assignment(s) at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod grants Microsoft.Compute/virtualMachines/delete"}
  - {user: dana@example.com, action: storage.blob.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: denied, reason: "denied: none of dana@example.com's 2 role assignment(s) at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod grants Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"}
  - {user: dana@example.com, action: "data:Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read", resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: denied, reason: "denied: none of dana@example.com's 2 role assignment(s) at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod grants Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read"}
  # Deny assignments.
  - {user: dana@example.com, action: vm.delete, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: denied, reason: "denied: deny assignment \"no-delete-locked\" at /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked blocks Microsoft.Compute/virtualMachines/delete for dana@example.com"}
  - {user: dana@example.com, action: resourcegroup.delete, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: denied, reason: "denied: deny assignment \"no-delete-locked\" at /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked blocks Microsoft.Resources/subscriptions/resourceGroups/delete for dana@example.com"}
  - {user: dana@example.com, action: vm.start, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: allowed, reason: "allowed: role \"Contributor\" assigned directly at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Compute/virtualMachines/start/action to dana@example.com"}
  - {user: dana@example.com, action: rbac.write, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: denied, reason: "denied: none of dana@example.com's 1 role assignment(s) at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked grants Microsoft.Authorization/roleAssignments/write"}
  - {user: dana@example.com, action: storage.listkeys, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: unsupported, reason: "unsupported: role \"Contributor\" grants Microsoft.Storage/storageAccounts/listkeys/action to dana@example.com at /subscriptions/33333333-3333-3333-3333-333333333333, but deny assignment \"no-listkeys-except-group\" may block it (a condition, an excluded group or a scope hallpass cannot place)"}
  - {user: dana@example.com, action: vm.deallocate, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: unsupported, reason: "unsupported: role \"Contributor\" grants Microsoft.Compute/virtualMachines/deallocate/action to dana@example.com at /subscriptions/33333333-3333-3333-3333-333333333333, but deny assignment \"cond-deny\" may block it (a condition, an excluded group or a scope hallpass cannot place)"}
  - {user: dana@example.com, action: vm.restart, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: denied, reason: "denied: deny assignment \"unnamed\" at /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/locked blocks Microsoft.Compute/virtualMachines/restart/action for dana@example.com"}
  - {user: dana@example.com, action: deployment.write, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/locked", want: allowed, reason: "allowed: role \"Contributor\" assigned directly at /subscriptions/33333333-3333-3333-3333-333333333333 grants Microsoft.Resources/deployments/write to dana@example.com"}
  - {user: dana@example.com, action: vm.start, resource: "resource:/subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Compute/virtualMachines/web-1", want: resource_not_visible, reason: "resource_not_visible: resource /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Compute/virtualMachines/web-1 does not exist or hallpass cannot read its assignments (it needs Reader there)"}
  # Conditions and management groups.
  - {user: dana@example.com, action: vm.delete, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/cond", want: unsupported, reason: "unsupported: role \"Owner\" grants Microsoft.Compute/virtualMachines/delete to dana@example.com only under an ABAC condition hallpass does not evaluate"}
  - {user: dana@example.com, action: vm.delete, resource: "managementgroup:corp", want: allowed, reason: "allowed: role \"Owner\" assigned directly at /providers/Microsoft.Management/managementGroups/corp grants Microsoft.Compute/virtualMachines/delete to dana@example.com"}
  - {user: dana@example.com, action: vm.delete, resource: "managementgroup:other-mg", want: unsupported, reason: "unsupported: role \"/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635\" grants Microsoft.Compute/virtualMachines/delete to dana@example.com at a management group whose place above managementgroup /providers/Microsoft.Management/managementGroups/other-mg hallpass cannot tell"}
  - {user: dana@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/empty", want: denied, reason: "denied: dana@example.com has no role assignment at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/empty"}
  # Identity.
  - {user: nobody@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: user_not_found, reason: "user_not_found: no Entra user has mail or UPN nobody@example.com"}
  - {user: dup@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: user_ambiguous, reason: "user_ambiguous: 2 Entra users have mail or UPN dup@example.com"}
  - {user: off@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: denied, reason: "denied: off@example.com's account is disabled"}
  - {user: quiet@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: unsupported, reason: "unsupported: whether quiet@example.com's account is enabled was not reported"}
  - {user: weird@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: upstream_error, reason: "upstream_error: Graph returned a user id that is not an object id"}
  - {user: dana@example.com, groups: [bbbbbbbb-0000-0000-0000-000000000001], action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/empty", want: denied, reason: "denied: dana@example.com has no role assignment at or above resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/empty"}
  # Invalid questions.
  - {user: dana@example.com, action: vm.read, resource: "subscription:not-a-guid", want: invalid_request, reason: "invalid_request: subscription: takes the subscription id (a GUID)"}
  - {user: dana@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/bad.", want: invalid_request, reason: "invalid_request: resourcegroup: takes <subscription id>/<resource group name>"}
  - {user: dana@example.com, action: vm.read, resource: "resource:/subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/prod/providers/Microsoft.Compute/../..", want: invalid_request, reason: "invalid_request: resource: segment \"..\" is not a resource type or name"}
  - {user: dana@example.com, action: vm.read, resource: "managementgroup:..", want: invalid_request, reason: "invalid_request: managementgroup: takes the group's name or id"}
  - {user: dana@example.com, action: vm.read, resource: "vm:x", want: invalid_request, reason: "invalid_request: resource type \"vm\" is not managementgroup:, subscription:, resourcegroup: or resource:"}
  - {user: dana@example.com, action: vm.read, resource: "subscription:33333333-3333-3333-3333-333333333333?x=1", want: invalid_request, reason: "invalid_request: resource \"subscription:33333333-3333-3333-3333-333333333333?x=1\" must not carry a query"}
  - {user: dana@example.com, action: "raw:Microsoft.Compute/*/read", resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: unknown_action, reason: "unknown_action: integration azure has no action \"raw:Microsoft.Compute/*/read\""}
  - {user: dana@example.com, action: vm.explode, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/prod", want: unknown_action, reason: "unknown_action: integration azure has no action \"vm.explode\""}
  # Scopes hallpass cannot read, and ARM failures.
  - {user: dana@example.com, action: vm.read, resource: "resourcegroup:33333333-3333-3333-3333-333333333333/hidden", want: resource_not_visible, reason: "resource_not_visible: resourcegroup /subscriptions/33333333-3333-3333-3333-333333333333/resourceGroups/hidden does not exist or hallpass cannot read its assignments (it needs Reader there)"}
  - {user: dana@example.com, action: vm.read, resource: "subscription:55555555-5555-5555-5555-555555555555", want: resource_not_visible, reason: "resource_not_visible: subscription /subscriptions/55555555-5555-5555-5555-555555555555 does not exist or hallpass cannot read its assignments (it needs Reader there)"}
