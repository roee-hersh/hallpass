# The databricks integration with a personal access token: the SCIM user,
# Unity Catalog effective permissions (direct, via a group, inherited) with
# the owner fallback, and Permissions API levels on workspace objects.
# dbx-denied answers every call 403; dbx-broken answers 500.
connections:
  - id: dbx-main
    integration: databricks
    url: "{{url}}"
    ca_file: "{{ca_file}}"
    auth_mode: token
    credential: env:HP_PARITY_DBX_PAT
  - id: dbx-denied
    integration: databricks
    url: "{{url}}/denied"
    ca_file: "{{ca_file}}"
    auth_mode: token
    credential: env:HP_PARITY_DBX_PAT
  - id: dbx-broken
    integration: databricks
    url: "{{url}}/broken"
    ca_file: "{{ca_file}}"
    auth_mode: token
    credential: env:HP_PARITY_DBX_PAT
env:
  HP_PARITY_DBX_PAT: dapi-parity
upstream:
  # The fake ignores the SCIM filter: every search returns these two, and
  # hallpass keeps the one whose userName is the email.
  - method: GET
    path: /api/2.0/preview/scim/v2/Users
    json:
      Resources:
        - {id: "100", userName: dana@example.com, active: true, groups: [{display: users, value: "1"}, {display: data-readers, value: "2"}]}
        - {id: "103", userName: sam@example.com, active: true, groups: [{display: users, value: "1"}, {display: admins, value: "3"}]}
        - {id: "104", userName: off@example.com, active: false, groups: []}
        - {id: "105", userName: nostatus@example.com}
  - method: GET
    path: /api/2.0/preview/scim/v2/Me
    json: {id: "7", userName: hallpass-bot@example.com, active: true, groups: [{display: users}]}
  - method: GET
    path: /api/2.1/unity-catalog/effective-permissions/table/main.sales.orders
    json:
      privilege_assignments:
        - principal: data-readers
          privileges:
            - {privilege: SELECT, inherited_from_type: SCHEMA, inherited_from_name: main.sales}
            - {privilege: USE_SCHEMA, inherited_from_type: SCHEMA, inherited_from_name: main.sales}
            - {privilege: USE_CATALOG, inherited_from_type: CATALOG, inherited_from_name: main}
        - principal: bob@example.com
          privileges: [{privilege: BROWSE}]
  - method: GET
    path: /api/2.1/unity-catalog/tables/main.sales.orders
    json: {name: orders, full_name: main.sales.orders, owner: someone@example.com}
  - method: GET
    path: /api/2.1/unity-catalog/effective-permissions/catalog/main
    json:
      privilege_assignments:
        - principal: hallpass-bot@example.com
          privileges: [{privilege: BROWSE}]
  - method: GET
    path: /api/2.1/unity-catalog/catalogs/main
    json: {name: main, owner: data-readers}
  - method: GET
    path: /api/2.1/unity-catalog/effective-permissions/schema/main.hidden
    json:
      privilege_assignments:
        - principal: hallpass-bot@example.com
          privileges: [{privilege: BROWSE}]
  - method: GET
    path: /api/2.1/unity-catalog/schemas/main.hidden
    json: {name: hidden, owner: someone@example.com}
  - method: GET
    path: /api/2.0/permissions/clusters/0123-456789-abcde1f2
    json:
      object_id: /clusters/0123-456789-abcde1f2
      access_control_list:
        - {group_name: users, all_permissions: [{permission_level: CAN_ATTACH_TO, inherited: true}]}
        - {user_name: dana@example.com, all_permissions: [{permission_level: CAN_RESTART, inherited: false}]}
        - {service_principal_name: bot, all_permissions: [{permission_level: CAN_MANAGE, inherited: false}]}
  - method: GET
    path: /api/2.0/permissions/jobs/43
    json:
      object_id: /jobs/43
      access_control_list:
        - {user_name: dana@example.com, all_permissions: [{permission_level: IS_OWNER}]}
  - path: /denied/api/*
    status: 403
    json: {error_code: PERMISSION_DENIED, message: nope}
  - path: /broken/api/*
    status: 500
    json: {error_code: INTERNAL_ERROR, message: boom}
checks:
  - {user: dana@example.com, action: table.read, resource: "table:main.sales.orders", want: allowed}
  - {user: dana@example.com, action: table.write, resource: "table:main.sales.orders", want: denied}
  - {user: dana@example.com, action: raw:SELECT, resource: "table:main.sales.orders", want: allowed}
  - {user: sam@example.com, action: table.read, resource: "table:main.sales.orders", want: denied}
  - {user: dana@example.com, action: uc.manage, resource: "catalog:main", want: allowed}
  - {user: dana@example.com, action: catalog.use, resource: "catalog:main", want: allowed}
  - {user: sam@example.com, action: catalog.use, resource: "catalog:main", want: resource_not_visible}
  - {user: dana@example.com, action: table.create, resource: "schema:main.hidden", want: resource_not_visible}
  - {user: dana@example.com, action: table.read, resource: "table:main.sales.missing", want: resource_not_visible}
  - {user: dana@example.com, action: cluster.attach, resource: "cluster:0123-456789-abcde1f2", want: allowed}
  - {user: dana@example.com, action: cluster.restart, resource: "cluster:0123-456789-abcde1f2", want: allowed}
  - {user: dana@example.com, action: cluster.manage, resource: "cluster:0123-456789-abcde1f2", want: denied}
  - {user: sam@example.com, action: cluster.manage, resource: "cluster:0123-456789-abcde1f2", want: allowed}
  - {user: dana@example.com, action: job.manage, resource: "job:43", want: allowed}
  - {user: sam@example.com, action: raw:IS_OWNER, resource: "job:43", want: denied}
  - {user: dana@example.com, action: job.view, resource: "job:44", want: resource_not_visible}
  - {user: bob@example.com, action: table.read, resource: "table:main.sales.orders", want: user_not_found}
  - {user: off@example.com, action: table.read, resource: "table:main.sales.orders", want: denied}
  - {user: nostatus@example.com, action: table.read, resource: "table:main.sales.orders", want: unsupported}
  - {user: dana@example.com, action: table.read, resource: "table:main.sales", want: invalid_request}
  - {user: dana@example.com, action: raw:CAN_FOO, resource: "cluster:0123-456789-abcde1f2", want: invalid_request}
  - {user: dana@example.com, action: table.read, resource: "cluster:abc", want: invalid_request}
  - {user: dana@example.com, action: raw:select, resource: "table:main.sales.orders", want: unknown_action}
  - {user: dana@example.com, action: table.read, resource: "table:main.sales.orders", connection: dbx-denied, want: credential_rejected}
  - {user: dana@example.com, action: table.read, resource: "table:main.sales.orders", connection: dbx-broken, want: upstream_error}
