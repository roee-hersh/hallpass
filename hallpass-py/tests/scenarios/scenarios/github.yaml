# The github integration (GitHub Enterprise Server layout: {url}/api/v3 and
# {url}/api/graphql) against a static fake of the REST and GraphQL APIs.
# github: identity_mode template with an email_domains allow-list and a
# configured installation_id; repository permissions, custom roles, issues,
# forking, branch rules and protection, organization and team membership
# and upstream failures. github-saml: identity_mode saml with the
# installation discovered. github-noprov, github-gqlerr and github-nomint:
# no SAML identity provider, a GraphQL permission error and an installation
# the App cannot mint a token for. Each connection's URL carries its own path
# prefix so it gets its own routes. The App key is a throwaway test key.
connections:
  - id: github
    integration: github
    url: "{{url}}"
    ca_file: "{{ca_file}}"
    organization: acme
    app_id: Iv1.parity
    installation_id: "42"
    credential: env:GH_APP_KEY
    identity_mode: template
    email_domains: example.com
  - id: github-saml
    integration: github
    url: "{{url}}/saml"
    ca_file: "{{ca_file}}"
    organization: acme
    app_id: Iv1.parity
    credential: env:GH_APP_KEY
  - id: github-noprov
    integration: github
    url: "{{url}}/noprov"
    ca_file: "{{ca_file}}"
    organization: acme
    app_id: Iv1.parity
    installation_id: "42"
    credential: env:GH_APP_KEY
  - id: github-gqlerr
    integration: github
    url: "{{url}}/gqlerr"
    ca_file: "{{ca_file}}"
    organization: acme
    app_id: Iv1.parity
    installation_id: "42"
    credential: env:GH_APP_KEY
  - id: github-nomint
    integration: github
    url: "{{url}}/nomint"
    ca_file: "{{ca_file}}"
    organization: acme
    app_id: Iv1.parity
    installation_id: "7"
    credential: env:GH_APP_KEY
    identity_mode: template
    email_domains: example.com
