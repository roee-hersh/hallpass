upstream:
  # Installation tokens, for every connection prefix.
  - {method: POST, path: /api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /saml/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /noprov/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /gqlerr/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /nomint/api/v3/app/installations/7/access_tokens, status: 404, json: {message: Not Found}}
  - {method: GET, path: /saml/api/v3/orgs/acme/installation, json: {id: 42, permissions: {metadata: read, members: read}, account: {login: acme}}}
  # Template identities.
  - {method: GET, path: /api/v3/users/dana, json: {login: dana, type: User}}
  - {method: GET, path: /api/v3/users/bob, json: {login: bob, type: User}}
  - {method: GET, path: /api/v3/users/carol, json: {login: carol, type: User}}
  - {method: GET, path: /api/v3/users/eve, json: {login: eve, type: User}}
  - {method: GET, path: /api/v3/users/acme, json: {login: acme, type: Organization}}
  - {method: GET, path: /api/v3/users/nobody, status: 404, json: {message: Not Found}}
  # Collaborator permissions.
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/dana/permission
    json: {permission: admin, role_name: admin, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: true, admin: true}}}
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/bob/permission
    json: {permission: read, role_name: read, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/carol/permission
    json: {permission: none, role_name: none, user: {login: carol, permissions: {pull: false, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/webapp/collaborators/dana/permission
    json: {permission: write, role_name: write, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/webapp/collaborators/bob/permission
    json: {permission: read, role_name: read, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/custom/collaborators/bob/permission
    json: {permission: read, role_name: security-champion, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - {method: GET, path: /api/v3/repos/acme/legacy/collaborators/bob/permission, json: {permission: security-champion, role_name: "", user: {login: bob}}}
  - {method: GET, path: /api/v3/repos/acme/secret/collaborators/dana/permission, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/repos/acme/limited/collaborators/dana/permission, status: 403, headers: {X-RateLimit-Remaining: "0"}, json: {message: API rate limit exceeded}}
  - {method: GET, path: /api/v3/repos/acme/forbidden/collaborators/dana/permission, status: 403, headers: {X-RateLimit-Remaining: "4999"}, json: {message: Resource not accessible by integration}}
  - {method: GET, path: /api/v3/repos/acme/broken/collaborators/dana/permission, status: 500, json: {message: Server Error}}
  - {method: GET, path: /api/v3/repos/acme/garbled/collaborators/dana/permission, json: {permission: 7}}
  # Repository records.
  - {method: GET, path: /api/v3/repos/acme/api, json: {name: api, has_issues: true, allow_forking: true, visibility: public}}
  - {method: GET, path: /api/v3/repos/acme/webapp, json: {name: webapp, has_issues: false, allow_forking: false, visibility: private}}
  # Branch rules and protection.
  - {method: GET, path: /api/v3/repos/acme/api/rules/branches/main, json: [{type: pull_request}, {type: required_status_checks}]}
  - {method: GET, path: /api/v3/repos/acme/api/branches/main/protection, status: 404, json: {message: Branch not protected}}
  - {method: GET, path: /api/v3/repos/acme/webapp/rules/branches/main, json: []}
  - method: GET
    path: /api/v3/repos/acme/webapp/branches/main/protection
    json: {restrictions: {users: [{login: carol}], teams: [{slug: release}], apps: []}, enforce_admins: {enabled: false}}
  - {method: GET, path: /api/v3/orgs/acme/teams/release/memberships/dana, status: 404, json: {message: Not Found}}
  # Organization and teams.
  - {method: GET, path: /api/v3/orgs/acme/memberships/dana, json: {state: active, role: admin}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/bob, json: {state: active, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/eve, json: {state: pending, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/carol, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme, json: {login: acme, members_can_create_repositories: true, members_can_create_public_repositories: false, members_can_create_private_repositories: true}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform, json: {slug: platform}}
  - {method: GET, path: /api/v3/orgs/acme/teams/nope, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/dana, json: {state: active, role: maintainer}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/bob, json: {state: active, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/carol, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme/teams/nope/memberships/dana, status: 404, json: {message: Not Found}}
  # SAML: the userName lookup and the listing both answer this page.
  - method: POST
    path: /saml/api/graphql
    json:
      data:
        organization:
          samlIdentityProvider:
            externalIdentities:
              pageInfo: {hasNextPage: false, endCursor: ""}
              nodes:
                - {user: {login: dana}, samlIdentity: {nameId: dana@example.com, username: dana@example.com}, scimIdentity: null}
                - {user: null, samlIdentity: {nameId: ghost@example.com, username: ghost@example.com}, scimIdentity: null}
                - {user: {login: zed}, samlIdentity: {nameId: Zed@Example.com, username: zed}, scimIdentity: null}
                - {user: {login: dupone}, samlIdentity: {nameId: dup@example.com, username: dup-one}, scimIdentity: null}
                - {user: {login: duptwo}, samlIdentity: {nameId: DUP@example.com, username: dup-two}, scimIdentity: null}
  - {method: GET, path: /saml/api/v3/repos/acme/api/collaborators/dana/permission, json: {permission: admin, role_name: admin, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: true, admin: true}}}}
  - {method: GET, path: /saml/api/v3/repos/acme/api/collaborators/zed/permission, json: {permission: read, role_name: read, user: {login: zed, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}}
  - {method: POST, path: /noprov/api/graphql, json: {data: {organization: {samlIdentityProvider: null}}}}
  - {method: POST, path: /gqlerr/api/graphql, json: {data: null, errors: [{type: FORBIDDEN, message: Resource not accessible by integration}]}}
checks:
  # Repository permissions.
  - {user: dana@example.com, action: repo.admin, resource: "repo:acme/api", want: allowed}
  - {user: dana@example.com, action: repo.read, resource: "repo:Acme/api", want: allowed}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/api", want: allowed}
  - {user: bob@example.com, action: repo.push, resource: "repo:acme/api", want: denied}
  - {user: carol@example.com, action: repo.read, resource: "repo:acme/api", want: denied}
  - {user: dana@example.com, action: repo.maintain, resource: "repo:acme/webapp", want: denied}
  - {user: bob@example.com, action: repo.push, resource: "repo:acme/custom", want: unsupported}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/custom", want: allowed}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/legacy", want: unsupported}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/secret", want: resource_not_visible}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/limited", want: upstream_rate_limited}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/forbidden", want: credential_rejected}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/broken", want: upstream_error}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/garbled", want: upstream_error}
  # Issues and pull requests.
  - {user: bob@example.com, action: issue.create, resource: "repo:acme/api", want: allowed}
  - {user: dana@example.com, action: issue.create, resource: "repo:acme/webapp", want: denied}
  - {user: bob@example.com, action: pr.create, resource: "repo:acme/api", want: allowed}
  - {user: bob@example.com, action: pr.create, resource: "repo:acme/webapp", want: denied}
  - {user: dana@example.com, action: pr.create, resource: "repo:acme/webapp", want: allowed}
  # Branch rules and classic protection.
  - {user: dana@example.com, action: repo.push, resource: "repo:acme/api@main", want: unsupported}
  - {user: dana@example.com, action: pr.merge, resource: "repo:acme/api@main", want: allowed}
  - {user: dana@example.com, action: repo.push, resource: "repo:acme/webapp@main", want: denied}
  - {user: dana@example.com, action: pr.merge, resource: "repo:acme/webapp@main", want: unsupported}
  - {user: bob@example.com, action: pr.merge, resource: "repo:acme/webapp@main", want: denied}
  # Organization and teams.
  - {user: dana@example.com, action: org.admin, resource: "org:acme", want: allowed}
  - {user: bob@example.com, action: org.member, resource: "org:ACME", want: allowed}
  - {user: bob@example.com, action: org.admin, resource: "org:acme", want: denied}
  - {user: eve@example.com, action: org.member, resource: "org:acme", want: denied}
  - {user: carol@example.com, action: org.member, resource: "org:acme", want: denied}
  - {user: bob@example.com, action: org.repo.create, resource: "org:acme", want: allowed}
  - {user: dana@example.com, action: team.maintainer, resource: "team:acme/platform", want: allowed}
  - {user: bob@example.com, action: team.member, resource: "team:acme/platform", want: allowed}
  - {user: bob@example.com, action: team.maintainer, resource: "team:acme/platform", want: denied}
  - {user: carol@example.com, action: team.member, resource: "team:acme/platform", want: denied}
  - {user: dana@example.com, action: team.member, resource: "team:acme/nope", want: resource_not_visible}
  # Template identities and request validation.
  - {user: nobody@example.com, action: repo.read, resource: "repo:acme/api", want: user_not_found}
  - {user: acme@example.com, action: repo.read, resource: "repo:acme/api", want: user_not_found}
  - {user: dana@other.example, action: repo.read, resource: "repo:acme/api", want: unsupported}
  - {user: dana@example.com, action: repo.read, resource: "repo:other/api", want: invalid_request}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api@a..b", want: invalid_request}
  - {user: dana@example.com, action: team.member, resource: "team:acme/Platform", want: invalid_request}
  - {user: dana@example.com, action: repo.read, resource: "org:acme", want: invalid_request}
  - {user: dana@example.com, action: repo.delete, resource: "repo:acme/api", want: unknown_action}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-nomint, want: credential_rejected}
  # SAML identities.
  - {user: dana@example.com, action: repo.admin, resource: "repo:acme/api", connection: github-saml, want: allowed}
  - {user: zed@example.com, action: repo.push, resource: "repo:acme/api", connection: github-saml, want: denied}
  - {user: ghost@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: unsupported}
  - {user: dup@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: user_ambiguous}
  - {user: nobody@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: user_not_found}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-noprov, want: unsupported}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-gqlerr, want: credential_rejected}
