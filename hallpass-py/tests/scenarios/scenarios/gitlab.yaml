# The gitlab integration against a static fake of the GitLab REST API (v4).
# gitlab: identity_mode admin_search with an administrator's token (the user
# search returns emails), memberships, visibility, protected branches,
# custom roles and upstream failures. gitlab-nonadmin: the search returns no
# emails, so the answer is unknown. gitlab-template: identity_mode template
# with an email_domains allow-list. Each connection's URL carries its own
# path prefix so it gets its own routes (the API lives at {url}/api/v4).
connections:
  - id: gitlab
    integration: gitlab
    url: "{{url}}"
    ca_file: "{{ca_file}}"
    credential: env:GITLAB_TOKEN
  - id: gitlab-nonadmin
    integration: gitlab
    url: "{{url}}/nonadmin"
    ca_file: "{{ca_file}}"
    credential: env:GITLAB_TOKEN
  - id: gitlab-template
    integration: gitlab
    url: "{{url}}/tpl"
    ca_file: "{{ca_file}}"
    credential: env:GITLAB_TOKEN
    identity_mode: template
    email_domains: example.com
env:
  GITLAB_TOKEN: glpat-parity
upstream:
  # admin_search: every search answers the same list; hallpass picks the
  # exact email match.
  - method: GET
    path: /api/v4/users
    json:
      - {id: 7, username: alice, state: active, email: alice@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 8, username: bob, state: active, email: Bob@Example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 9, username: carol, state: active, email: carol@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 10, username: blocked, state: blocked, email: blocked@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 11, username: dup1, state: active, email: dup@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 12, username: dup2, state: active, email: DUP@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 13, username: root, state: active, email: root@example.com, public_email: "", bot: false, is_admin: true, external: false}
      - {id: 14, username: dana, state: active, email: dana@example.com, public_email: "", bot: false, is_admin: false, external: false}
      - {id: 15, username: newbie, state: something_new, email: newbie@example.com, public_email: "", bot: false, is_admin: false, external: false}
  # Project acme/webapp (private): alice Developer, bob Maintainer, dana a
  # Guest with a custom role; main is protected for Maintainers.
  - {method: GET, path: /api/v4/projects/acme/webapp, json: {id: 100, visibility: private}}
  - {method: GET, path: /api/v4/projects/acme/webapp/members/all/7, json: {access_level: 30, state: active, member_role: null}}
  - {method: GET, path: /api/v4/projects/acme/webapp/members/all/8, json: {access_level: 40, state: active, member_role: null}}
  - {method: GET, path: /api/v4/projects/acme/webapp/members/all/14, json: {access_level: 10, state: active, member_role: {id: 5, name: guest-plus}}}
  - method: GET
    path: /api/v4/projects/acme/webapp/protected_branches
    json:
      - name: main
        push_access_levels: [{access_level: 40, user_id: null, group_id: null}]
        merge_access_levels: [{access_level: 30, user_id: null, group_id: null}]
      - name: locked
        push_access_levels: [{access_level: 0}]
        merge_access_levels: [{access_level: 0}]
  # Project acme/public: nobody is a member.
  - {method: GET, path: /api/v4/projects/acme/public, json: {id: 101, visibility: public, issues_access_level: enabled}}
  - {method: GET, path: /api/v4/projects/acme/noissues, json: {id: 103, visibility: public, issues_access_level: disabled}}
  - {method: GET, path: /api/v4/projects/acme/internal, json: {id: 102, visibility: internal}}
  # Group acme: alice Owner.
  - {method: GET, path: /api/v4/groups/acme/members/all/7, json: {access_level: 50, state: active}}
  - {method: GET, path: /api/v4/groups/acme, json: {id: 200, full_path: acme}}
  # Failures.
  - {method: GET, path: /api/v4/projects/acme/locked/members/all/7, status: 403, json: {message: 403 Forbidden}}
  - {method: GET, path: /api/v4/projects/acme/broken/members/all/7, status: 500, json: {message: boom}}
  - {method: GET, path: /api/v4/projects/acme/busy/members/all/7, status: 429, headers: {Retry-After: "60"}, json: {message: slow down}}
  - {method: GET, path: /api/v4/projects/acme/garbled/members/all/7, body: "{not json"}
  # A non-admin token: the search carries no email.
  - method: GET
    path: /nonadmin/api/v4/users
    json:
      - {id: 7, username: alice, state: active, public_email: "", bot: false}
  # identity_mode template: GET /users?username=<local>.
  - method: GET
    path: /tpl/api/v4/users
    json:
      - {id: 7, username: alice, state: active, public_email: "", bot: false}
  - {method: GET, path: /tpl/api/v4/projects/acme/webapp/members/all/7, json: {access_level: 20, state: active}}
checks:
  - {user: alice@example.com, action: mr.create, resource: "project:acme/webapp", want: allowed, reason: "allowed: alice has Developer access to project acme/webapp, which grants mr.create"}
  - {user: ALICE@example.com, action: project.read, resource: "project:acme/webapp", want: allowed, reason: "allowed: alice has Developer access to project acme/webapp, which grants project.read"}
  - {user: alice@example.com, action: project.delete, resource: "project:acme/webapp", want: denied, reason: "denied: alice has Developer access to project acme/webapp; project.delete needs Owner"}
  - {user: bob@example.com, action: member.manage, resource: "project:acme/webapp", want: allowed, reason: "allowed: bob has Maintainer access to project acme/webapp, which grants member.manage"}
  - {user: nobody@example.com, action: project.read, resource: "project:acme/webapp", want: user_not_found, reason: "user_not_found: no GitLab account has the email nobody@example.com"}
  - {user: dup@example.com, action: project.read, resource: "project:acme/webapp", want: user_ambiguous, reason: "user_ambiguous: 2 GitLab accounts have the email dup@example.com"}
  - {user: "alice @example.com", action: project.read, resource: "project:acme/webapp", want: invalid_request, reason: "invalid_request: user contains whitespace or a control character"}
  - {user: blocked@example.com, action: project.read, resource: "project:acme/webapp", want: denied, reason: "denied: GitLab account blocked is blocked"}
  - {user: newbie@example.com, action: project.read, resource: "project:acme/webapp", want: unsupported, reason: "unsupported: GitLab account newbie is in state \"something_new\", which hallpass does not know"}
  # Non-members: visibility decides, administrators pass.
  - {user: carol@example.com, action: project.read, resource: "project:acme/webapp", want: denied, reason: "denied: carol is not a member of project acme/webapp (private); project.read needs Guest, Planner, Reporter, Security Manager, Developer, Maintainer, Owner"}
  - {user: carol@example.com, action: project.read, resource: "project:acme/public", want: allowed, reason: "allowed: carol is not a member of project acme/public, but the project is public and project.read is open to every signed-in user"}
  - {user: carol@example.com, action: issue.create, resource: "project:acme/public", want: allowed, reason: "allowed: carol is not a member of project acme/public, but the project is public and issue.create is open to every signed-in user"}
  - {user: carol@example.com, action: issue.create, resource: "project:acme/noissues", want: denied, reason: "denied: issues are disabled on project acme/noissues, so no one can create one"}
  - {user: carol@example.com, action: project.read, resource: "project:acme/internal", want: allowed, reason: "allowed: carol is not a member of project acme/internal, but the project is internal and project.read is open to every signed-in user"}
  - {user: carol@example.com, action: mr.create, resource: "project:acme/public", want: denied, reason: "denied: carol is not a member of project acme/public (public); mr.create needs Developer, Maintainer, Owner"}
  - {user: root@example.com, action: project.delete, resource: "project:acme/webapp", want: allowed, reason: "allowed: root is an instance administrator, which grants project.delete on every project"}
  - {user: alice@example.com, action: project.read, resource: "project:acme/missing", want: resource_not_visible, reason: "resource_not_visible: project acme/missing is not visible to the token (HTTP 404)"}
  # Levels and custom roles.
  - {user: alice@example.com, action: mr.approve, resource: "project:acme/webapp", want: allowed, reason: "allowed: alice has Developer access to project acme/webapp, which grants mr.approve"}
  - {user: dana@example.com, action: project.read, resource: "project:acme/webapp", want: allowed, reason: "allowed: dana has custom role \"guest-plus\" (base Guest) access to project acme/webapp, which grants project.read"}
  - {user: dana@example.com, action: repo.push, resource: "project:acme/webapp@feature", want: unsupported, reason: "unsupported: dana has custom role \"guest-plus\" (base Guest) on project acme/webapp; the base level does not grant repo.push but a custom role can add abilities hallpass cannot see"}
  # Protected branches.
  - {user: alice@example.com, action: repo.push, resource: "project:acme/webapp", want: unsupported, reason: "unsupported: project acme/webapp has 2 protected-branch rules, which decide repo.push per branch; add @branch to the resource"}
  - {user: alice@example.com, action: repo.push, resource: "project:acme/webapp@main", want: denied, reason: "denied: alice has Developer access to project acme/webapp, and no entry of protected branch rule main of project acme/webapp allows that user to push to branch main"}
  - {user: alice@example.com, action: mr.merge, resource: "project:acme/webapp@main", want: allowed, reason: "allowed: alice may merge into branch main: protected branch rule main of project acme/webapp allows Developer and up, and the user has Developer access"}
  - {user: bob@example.com, action: repo.push, resource: "project:acme/webapp@main", want: allowed, reason: "allowed: bob may push to branch main: protected branch rule main of project acme/webapp allows Maintainer and up, and the user has Maintainer access"}
  - {user: bob@example.com, action: repo.push, resource: "project:acme/webapp@locked", want: denied, reason: "denied: no one may push to branch locked: protected branch rule locked of project acme/webapp allows no one"}
  - {user: alice@example.com, action: repo.push, resource: "project:acme/webapp@feature/x", want: allowed, reason: "allowed: alice has Developer access to project acme/webapp, which grants repo.push"}
  # Groups.
  - {user: alice@example.com, action: group.admin, resource: "group:acme", want: allowed, reason: "allowed: alice has Owner access to group acme, which grants group.admin"}
  - {user: carol@example.com, action: group.member, resource: "group:acme", want: denied, reason: "denied: carol is not a member of group acme (); group.member needs Guest, Planner, Reporter, Security Manager, Developer, Maintainer, Owner"}
  - {user: alice@example.com, action: group.member, resource: "group:nope", want: resource_not_visible, reason: "resource_not_visible: group nope is not visible to the token (HTTP 404)"}
  # Bad requests.
  - {user: alice@example.com, action: project.read, resource: "group:acme", want: invalid_request, reason: "invalid_request: action project.read takes a project:<path-or-id> resource, not group:"}
  - {user: alice@example.com, action: project.read, resource: "project:../etc", want: invalid_request, reason: "invalid_request: project \"../etc\": path segments . and .. are not allowed"}
  - {user: alice@example.com, action: repo.push, resource: "project:acme/webapp@a..b", want: invalid_request, reason: "invalid_request: branch \"a..b\": must not contain .. or @{"}
  - {user: alice@example.com, action: project.read, resource: "project:acme/webapp?x=1", want: invalid_request, reason: "invalid_request: gitlab resources take no query parameters"}
  - {user: alice@example.com, action: repo.delete, resource: "project:acme/webapp", want: unknown_action, reason: "unknown_action: integration gitlab has no action \"repo.delete\""}
  # Upstream failures.
  - {user: alice@example.com, action: project.read, resource: "project:acme/locked", want: credential_rejected, reason: "credential_rejected: the token may not read the members of project acme/locked (HTTP 403)"}
  - {user: alice@example.com, action: project.read, resource: "project:acme/broken", want: upstream_error, reason: "upstream_error: upstream returned HTTP 500"}
  - {user: alice@example.com, action: project.read, resource: "project:acme/busy", want: upstream_rate_limited, reason: "upstream_rate_limited: rate limited by the upstream system"}
  - {user: alice@example.com, action: project.read, resource: "project:acme/garbled", want: upstream_error, reason: "upstream_error: upstream call failed"}
  # A non-admin token cannot see emails.
  - {user: alice@example.com, action: project.read, resource: "project:acme/webapp", connection: gitlab-nonadmin, want: unsupported, reason: "unsupported: the token's user is not an administrator, so private emails are not searchable; use an administrator's token or another identity_mode"}
  # identity_mode template.
  - {user: alice@example.com, action: issue.edit, resource: "project:acme/webapp", connection: gitlab-template, want: allowed, reason: "allowed: alice has Reporter access to project acme/webapp, which grants issue.edit"}
  - {user: alice@example.com, action: mr.create, resource: "project:acme/webapp", connection: gitlab-template, want: denied, reason: "denied: alice has Reporter access to project acme/webapp; mr.create needs Developer, Maintainer, Owner"}
  - {user: alice@attacker.example, action: project.read, resource: "project:acme/webapp", connection: gitlab-template, want: unsupported, reason: "unsupported: domain not allowed for template identities: alice@attacker.example is not in email_domains"}
