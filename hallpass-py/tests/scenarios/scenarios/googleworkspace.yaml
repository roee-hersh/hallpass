# googleworkspace: keyless auth (metadata token, IAM Credentials signJwt, JWT
# bearer exchange) and the Directory, Drive, Calendar, Gmail and Groups calls,
# every endpoint pointed at the fake upstream.
connections:
  - id: gws
    integration: googleworkspace
    admin_email: admin@example.com
    auth_mode: keyless
    service_account_email: hallpass@proj.iam.gserviceaccount.com
    enable_gmail_settings: "true"
    token_url: "{{url}}/token"
    api_url: "{{url}}"
    metadata_url: "{{url}}"
    iamcredentials_url: "{{url}}"
    ca_file: "{{ca_file}}"
  # The token endpoint refuses to let hallpass act as the admin.
  - id: gws-nodelegation
    integration: googleworkspace
    admin_email: admin@example.com
    auth_mode: keyless
    service_account_email: hallpass@proj.iam.gserviceaccount.com
    token_url: "{{url}}/badtoken"
    api_url: "{{url}}"
    metadata_url: "{{url}}"
    iamcredentials_url: "{{url}}"
    ca_file: "{{ca_file}}"
  # A credential that is not a key JSON.
  - id: gws-badkey
    integration: googleworkspace
    admin_email: admin@example.com
    credential: env:HP_PARITY_GWS_BADKEY
    token_url: "{{url}}/token"
    api_url: "{{url}}"
    ca_file: "{{ca_file}}"
  # Gmail settings off.
  - id: gws-nogmail
    integration: googleworkspace
    admin_email: admin@example.com
    auth_mode: keyless
    service_account_email: hallpass@proj.iam.gserviceaccount.com
    token_url: "{{url}}/token"
    api_url: "{{url}}"
    metadata_url: "{{url}}"
    iamcredentials_url: "{{url}}"
    ca_file: "{{ca_file}}"
env:
  HP_PARITY_GWS_BADKEY: not json
upstream:
  - {method: GET, path: /computeMetadata/v1/instance/service-accounts/default/token, json: {access_token: meta, expires_in: 3599, token_type: Bearer}}
  - {method: POST, path: "/v1/projects/-/serviceAccounts/hallpass@proj.iam.gserviceaccount.com:signJwt", json: {keyId: k1, signedJwt: a.b.c}}
  - {method: POST, path: /token, json: {access_token: tok, expires_in: 3599, token_type: Bearer}}
  - {method: POST, path: /badtoken, status: 400, json: {error: invalid_grant, error_description: not allowed}}
  - {method: GET, path: /admin/directory/v1/users/dana@example.com, json: {id: "100", primaryEmail: dana@example.com, suspended: false, archived: false}}
  - {method: GET, path: /admin/directory/v1/users/bob@example.com, json: {id: "101", primaryEmail: Bob@Example.com, suspended: false, archived: false}}
  - {method: GET, path: /admin/directory/v1/users/sus@example.com, json: {id: "102", primaryEmail: sus@example.com, suspended: true, archived: false}}
  - {method: GET, path: /admin/directory/v1/users/arch@example.com, json: {id: "103", primaryEmail: arch@example.com, suspended: false, archived: true}}
  - {method: GET, path: /admin/directory/v1/users/nostatus@example.com, json: {id: "104", primaryEmail: nostatus@example.com}}
  - {method: GET, path: /admin/directory/v1/users/noprimary@example.com, json: {id: "105", suspended: false, archived: false}}
  - {method: GET, path: /admin/directory/v1/users/forbidden@example.com, status: 403, json: {error: {code: 403, message: no, errors: [{reason: forbidden}]}}}
  - method: GET
    path: /drive/v3/files/1AbCdEfGhIjKlMnOpQrStUvWxYz
    json: {capabilities: {canDownload: true, canEdit: true, canShare: false}, trashed: false}
  - method: GET
    path: /drive/v3/files/1BbCdEfGhIjKlMnOpQrStUvWxYz
    json: {capabilities: {canEdit: false}, trashed: true}
  - {method: GET, path: /drive/v3/files/1CbCdEfGhIjKlMnOpQrStUvWxYz, status: 404, json: {error: {code: 404, message: x, errors: [{domain: global, reason: notFound}]}}}
  - {method: GET, path: /drive/v3/files/1DbCdEfGhIjKlMnOpQrStUvWxYz, status: 404, json: {error: {code: 404, message: x}}}
  - {method: GET, path: /drive/v3/files/1EbCdEfGhIjKlMnOpQrStUvWxYz, status: 403, json: {error: {code: 403, message: x, errors: [{domain: global, reason: insufficientPermissions}]}}}
  - {method: GET, path: /drive/v3/files/1FbCdEfGhIjKlMnOpQrStUvWxYz, status: 403, json: {error: {code: 403, message: x, errors: [{domain: global, reason: domainPolicy}]}}}
  - {method: GET, path: /drive/v3/files/1GbCdEfGhIjKlMnOpQrStUvWxYz, status: 403, json: {error: {code: 403, message: x, errors: [{domain: usageLimits, reason: userRateLimitExceeded}]}}}
  - {method: GET, path: /drive/v3/files/1HbCdEfGhIjKlMnOpQrStUvWxYz, status: 500, json: {error: {code: 500, message: boom}}}
  - {method: GET, path: /drive/v3/files/1IbCdEfGhIjKlMnOpQrStUvWxYz, status: 429, headers: {Retry-After: "30"}, json: {error: {code: 429, message: slow}}}
  - {method: GET, path: /calendar/v3/users/me/calendarList/ro@example.com, json: {id: ro@example.com, accessRole: reader}}
  - {method: GET, path: /calendar/v3/users/me/calendarList/odd@example.com, json: {id: odd@example.com, accessRole: editor}}
  - {method: GET, path: /admin/directory/v1/groups/eng@example.com/hasMember/dana@example.com, json: {isMember: true}}
  - {method: GET, path: /admin/directory/v1/groups/eng@example.com/hasMember/bob@example.com, json: {isMember: false}}
  - {method: GET, path: /admin/directory/v1/groups/eng@example.com/hasMember/nostatus@example.com, json: {}}
  - {method: GET, path: /admin/directory/v1/groups/external@other.com/hasMember/dana@example.com, status: 400, json: {error: {code: 400, message: x, errors: [{reason: invalid}]}}}
  - method: GET
    path: /gmail/v1/users/me/settings/sendAs
    json:
      sendAs:
        - {sendAsEmail: dana@example.com, isPrimary: true}
        - {sendAsEmail: support@example.com, verificationStatus: accepted}
        - {sendAsEmail: pending@example.com, verificationStatus: pending}
        - {sendAsEmail: blank@example.com, treatAsAlias: true}
  - method: GET
    path: /gmail/v1/users/me/settings/delegates
    json:
      delegates:
        - {delegateEmail: dana@example.com, verificationStatus: accepted}
        - {delegateEmail: bob@example.com, verificationStatus: expired}
checks:
  - {user: dana@example.com, action: user.active, resource: "user:dana@example.com", want: allowed, reason: "allowed: dana@example.com is active"}
  - {user: Dana@Example.com, action: user.active, resource: "user:bob@example.com", want: unsupported, reason: "unsupported: user.active is evaluated for the caller's own account only; bob@example.com is another account"}
  - {user: sus@example.com, action: drive.file.read, resource: "file:1AbCdEfGhIjKlMnOpQrStUvWxYz", want: denied, reason: "denied: sus@example.com is suspended"}
  - {user: arch@example.com, action: user.active, resource: "user:arch@example.com", want: denied, reason: "denied: arch@example.com is archived"}
  - {user: nostatus@example.com, action: user.active, resource: "user:nostatus@example.com", want: unsupported, reason: "unsupported: the Directory did not report whether nostatus@example.com is suspended"}
  - {user: nobody@example.com, action: user.active, resource: "user:nobody@example.com", want: user_not_found, reason: "user_not_found: no Workspace account for nobody@example.com (aliases resolve; external accounts do not)"}
  - {user: noprimary@example.com, action: user.active, resource: "user:noprimary@example.com", want: upstream_error, reason: "upstream_error: the Directory returned a user without a primary email"}
  - {user: forbidden@example.com, action: user.active, resource: "user:forbidden@example.com", want: credential_rejected, reason: "credential_rejected: Google refused the call: the scope is not delegated, the API is not enabled, or the admin role lacks the privilege (forbidden)"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1AbCdEfGhIjKlMnOpQrStUvWxYz", want: allowed, reason: "allowed: dana@example.com can see file 1AbCdEfGhIjKlMnOpQrStUvWxYz"}
  - {user: dana@example.com, action: drive.file.edit, resource: "file:1AbCdEfGhIjKlMnOpQrStUvWxYz", want: allowed, reason: "allowed: dana@example.com has canEdit on file 1AbCdEfGhIjKlMnOpQrStUvWxYz"}
  - {user: dana@example.com, action: drive.file.share, resource: "file:1AbCdEfGhIjKlMnOpQrStUvWxYz", want: denied, reason: "denied: dana@example.com lacks canShare on file 1AbCdEfGhIjKlMnOpQrStUvWxYz"}
  - {user: dana@example.com, action: drive.file.delete, resource: "file:1AbCdEfGhIjKlMnOpQrStUvWxYz", want: unsupported, reason: "unsupported: Drive did not report canDelete for file 1AbCdEfGhIjKlMnOpQrStUvWxYz"}
  - {user: bob@example.com, action: drive.file.edit, resource: "file:1BbCdEfGhIjKlMnOpQrStUvWxYz", want: denied, reason: "denied: bob@example.com lacks canEdit on file 1BbCdEfGhIjKlMnOpQrStUvWxYz (the file is in the trash)"}
  - {user: bob@example.com, action: drive.file.read, resource: "file:1BbCdEfGhIjKlMnOpQrStUvWxYz", want: allowed, reason: "allowed: bob@example.com can see file 1BbCdEfGhIjKlMnOpQrStUvWxYz (the file is in the trash)"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1CbCdEfGhIjKlMnOpQrStUvWxYz", want: denied, reason: "denied: dana@example.com has no access to file 1CbCdEfGhIjKlMnOpQrStUvWxYz, or the file does not exist: Drive does not distinguish"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1DbCdEfGhIjKlMnOpQrStUvWxYz", want: resource_not_visible, reason: "resource_not_visible: Drive answered 404 for file 1DbCdEfGhIjKlMnOpQrStUvWxYz without reason notFound, so it is not visible as dana@example.com for a reason hallpass does not model"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1EbCdEfGhIjKlMnOpQrStUvWxYz", want: credential_rejected, reason: "credential_rejected: Google refused the call: the scope is not delegated, the API is not enabled, or the admin role lacks the privilege (insufficientPermissions)"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1FbCdEfGhIjKlMnOpQrStUvWxYz", want: unsupported, reason: "unsupported: Google refused the call for this user (domainPolicy): a Drive or Workspace policy blocks it, so hallpass cannot evaluate the action"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1GbCdEfGhIjKlMnOpQrStUvWxYz", want: upstream_rate_limited, reason: "upstream_rate_limited: rate limited by Google"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1HbCdEfGhIjKlMnOpQrStUvWxYz", want: upstream_error, reason: "upstream_error: upstream returned HTTP 500"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:1IbCdEfGhIjKlMnOpQrStUvWxYz", want: upstream_rate_limited, reason: "upstream_rate_limited: rate limited by the upstream system"}
  - {user: dana@example.com, action: drive.file.read, resource: "file:short", want: invalid_request, reason: "invalid_request: file: id must be a Drive file id"}
  - {user: dana@example.com, action: calendar.read, resource: "calendar:ro@example.com", want: allowed, reason: "allowed: dana@example.com has role reader on calendar ro@example.com"}
  - {user: dana@example.com, action: calendar.event.write, resource: "calendar:ro@example.com", want: denied, reason: "denied: dana@example.com has role reader on calendar ro@example.com, which does not allow event.write"}
  - {user: dana@example.com, action: calendar.share, resource: "calendar:primary", want: allowed, reason: "allowed: dana@example.com has role owner on calendar primary"}
  - {user: dana@example.com, action: calendar.read, resource: "calendar:odd@example.com", want: unsupported, reason: "unsupported: calendar odd@example.com reports access role \"editor\", which hallpass does not model"}
  - {user: dana@example.com, action: calendar.read, resource: "calendar:gone@example.com", want: unsupported, reason: "unsupported: calendar gone@example.com is not in dana@example.com's calendar list; ACL access may still exist"}
  - {user: dana@example.com, action: group.member, resource: "group:Eng@example.com", want: allowed, reason: "allowed: dana@example.com is a member of group eng@example.com (directly or through nested groups)"}
  - {user: bob@example.com, action: group.member, resource: "group:eng@example.com", want: denied, reason: "denied: bob@example.com is not a member of group eng@example.com"}
  - {user: dana@example.com, action: group.member, resource: "group:external@other.com", want: unsupported, reason: "unsupported: group external@other.com is unknown or outside the domain, so membership of dana@example.com cannot be checked"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:dana@example.com", want: allowed, reason: "allowed: dana@example.com is the primary address of dana@example.com's own mailbox"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:support@example.com", want: allowed, reason: "allowed: dana@example.com has support@example.com as a verified send-as address"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:pending@example.com", want: denied, reason: "denied: dana@example.com has pending@example.com as a send-as address but it is awaiting verification by the owner"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:blank@example.com", want: unsupported, reason: "unsupported: Gmail lists blank@example.com as a send-as address of dana@example.com without a verification status"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:other@example.com", want: denied, reason: "denied: dana@example.com has no send-as address other@example.com"}
  - {user: dana@example.com, action: mail.delegate_access, resource: "mailbox:boss@example.com", want: allowed, reason: "allowed: dana@example.com is an accepted delegate of mailbox boss@example.com"}
  - {user: bob@example.com, action: mail.delegate_access, resource: "mailbox:boss@example.com", want: denied, reason: "denied: bob@example.com is a delegate of mailbox boss@example.com but the delegation is expired"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:support@example.com", connection: gws-nogmail, want: unsupported, reason: "unsupported: send-as addresses are read with the gmail.settings.basic scope; set enable_gmail_settings to evaluate mail.send_as for support@example.com"}
  - {user: dana@example.com, action: user.active, resource: "user:dana@example.com", connection: gws-nodelegation, want: credential_rejected, reason: "credential_rejected: could not act as admin_email: domain-wide delegation is missing the scope or admin_email is invalid (invalid_grant)"}
  - {user: dana@example.com, action: user.active, resource: "user:dana@example.com", connection: gws-badkey, want: credential_rejected, reason: "credential_rejected: credential is not a service-account key JSON"}
