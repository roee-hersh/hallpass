# The jira integration with auth_mode basic against a static fake of the
# Jira Cloud REST API: user search (exact, ambiguous, hidden, crowded),
# project and issue lookups, permissions/check echoes, and upstream failures.
# Each connection's site URL carries its own path prefix so it gets its own
# routes.
connections:
  - id: jira
    integration: jira
    url: "{{url}}"
    ca_file: "{{ca_file}}"
    auth_mode: basic
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-hidden
    integration: jira
    url: "{{url}}/hidden"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-crowded
    integration: jira
    url: "{{url}}/crowded"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-rejected
    integration: jira
    url: "{{url}}/rejected"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-noadmin
    integration: jira
    url: "{{url}}/noadmin"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-badkey
    integration: jira
    url: "{{url}}/badkey"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-broken
    integration: jira
    url: "{{url}}/broken"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-limited
    integration: jira
    url: "{{url}}/limited"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-badid
    integration: jira
    url: "{{url}}/badid"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
  - id: jira-badtype
    integration: jira
    url: "{{url}}/badtype"
    ca_file: "{{ca_file}}"
    username: bot@example.com
    credential: env:JIRA_TOKEN
env:
  JIRA_TOKEN: parity-jira-token
upstream:
  # jira
  - method: GET
    path: /rest/api/3/user/search
    json:
      - {accountId: acc-dana, accountType: atlassian, active: true, emailAddress: Dana@example.com, displayName: Dana}
      - {accountId: acc-bob-old, accountType: atlassian, active: false, emailAddress: bob@example.com, displayName: Bob (old)}
      - {accountId: acc-bot, accountType: app, active: true, emailAddress: bob@example.com, displayName: Bot}
      - {accountId: acc-bob, accountType: atlassian, active: true, emailAddress: bob@example.com, displayName: Bob}
      - {accountId: acc-twin1, accountType: atlassian, active: true, emailAddress: twin@example.com, displayName: Twin 1}
      - {accountId: acc-twin2, accountType: atlassian, active: true, emailAddress: twin@example.com, displayName: Twin 2}
      - {accountId: acc-noname, accountType: atlassian, active: true, emailAddress: noname@example.com}
  - method: GET
    path: /rest/api/3/project/OPS
    json: {id: "10000", key: OPS, name: Operations}
  - method: GET
    path: /rest/api/3/project/SEC
    json: {id: "10001", key: SEC, name: Security}
  - method: GET
    path: /rest/api/3/issue/OPS-1
    json: {id: "10010", key: OPS-1, fields: {project: {id: "10000"}}}
  - method: GET
    path: /rest/api/3/issue/SEC-7
    json: {id: "10020", key: SEC-7, fields: {project: {id: "10001"}}}
  - method: POST
    path: /rest/api/3/permissions/check
    json:
      projectPermissions:
        - {permission: CREATE_ISSUES, projects: [10000], issues: [10010]}
        - {permission: BROWSE_PROJECTS, projects: [10000, 10001], issues: [10010, 10020]}
      globalPermissions: [ADMINISTER]
  # jira-hidden: the only candidates hide their email
  - method: GET
    path: /hidden/rest/api/3/user/search
    json:
      - {accountId: acc-hidden, accountType: atlassian, active: true, emailAddress: "", displayName: dana@example.com}
      - {accountId: acc-hidden2, accountType: atlassian, active: true, displayName: Hidden 2}
