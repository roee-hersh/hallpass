        - {accountId: acc-crowd-36, accountType: atlassian, active: true, emailAddress: crowd-36@example.com, displayName: Crowd 36}
        - {accountId: acc-crowd-37, accountType: atlassian, active: true, emailAddress: crowd-37@example.com, displayName: Crowd 37}
        - {accountId: acc-crowd-38, accountType: atlassian, active: true, emailAddress: crowd-38@example.com, displayName: Crowd 38}
        - {accountId: acc-crowd-39, accountType: atlassian, active: true, emailAddress: crowd-39@example.com, displayName: Crowd 39}
        - {accountId: acc-crowd-40, accountType: atlassian, active: true, emailAddress: crowd-40@example.com, displayName: Crowd 40}
        - {accountId: acc-crowd-41, accountType: atlassian, active: true, emailAddress: crowd-41@example.com, displayName: Crowd 41}
        - {accountId: acc-crowd-42, accountType: atlassian, active: true, emailAddress: crowd-42@example.com, displayName: Crowd 42}
        - {accountId: acc-crowd-43, accountType: atlassian, active: true, emailAddress: crowd-43@example.com, displayName: Crowd 43}
        - {accountId: acc-crowd-44, accountType: atlassian, active: true, emailAddress: crowd-44@example.com, displayName: Crowd 44}
        - {accountId: acc-crowd-45, accountType: atlassian, active: true, emailAddress: crowd-45@example.com, displayName: Crowd 45}
        - {accountId: acc-crowd-46, accountType: atlassian, active: true, emailAddress: crowd-46@example.com, displayName: Crowd 46}
        - {accountId: acc-crowd-47, accountType: atlassian, active: true, emailAddress: crowd-47@example.com, displayName: Crowd 47}
        - {accountId: acc-crowd-48, accountType: atlassian, active: true, emailAddress: crowd-48@example.com, displayName: Crowd 48}
        - {accountId: acc-crowd-49, accountType: atlassian, active: true, emailAddress: crowd-49@example.com, displayName: Crowd 49}
  # jira-rejected: the credential is refused
  - method: GET
    path: /rejected/rest/api/3/user/search
    status: 401
    json: {errorMessages: [unauthorized]}
  # jira-noadmin: users can be searched, other users' permissions cannot be checked
  - method: GET
    path: /noadmin/rest/api/3/user/search
    json:
      - {accountId: acc-dana, accountType: atlassian, active: true, emailAddress: dana@example.com, displayName: Dana}
  - method: GET
    path: /noadmin/rest/api/3/project/OPS
    status: 403
    json: {errorMessages: [forbidden]}
  - method: GET
    path: /noadmin/rest/api/3/issue/OPS-1
    json: {id: "10010", key: OPS-1}
  - method: POST
    path: /noadmin/rest/api/3/permissions/check
    status: 403
    json: {errorMessages: [forbidden]}
  # jira-badkey: permissions/check refuses the key
  - method: GET
    path: /badkey/rest/api/3/user/search
    json:
      - {accountId: acc-dana, accountType: atlassian, active: true, emailAddress: dana@example.com, displayName: Dana}
  - method: POST
    path: /badkey/rest/api/3/permissions/check
    status: 400
    json: {errorMessages: [unknown permission]}
  # jira-broken: server errors and malformed answers
  - method: GET
    path: /broken/rest/api/3/user/search
    status: 500
    body: oops
  # jira-limited: rate limited
  - method: GET
    path: /limited/rest/api/3/user/search
    status: 429
    headers: {Retry-After: "30"}
    json: {errorMessages: [slow down]}
  # jira-badid: lookups answer ids that are not positive numbers
  - method: GET
    path: /badid/rest/api/3/user/search
    json:
      - {accountId: acc-dana, accountType: atlassian, active: true, emailAddress: dana@example.com, displayName: Dana}
  - method: GET
    path: /badid/rest/api/3/project/OPS
    json: {id: "0", key: OPS}
  - method: GET
    path: /badid/rest/api/3/issue/OPS-1
    json: {id: 10010, key: OPS-1}
  - method: POST
    path: /badid/rest/api/3/permissions/check
    json:
      projectPermissions:
        - {permission: CREATE_ISSUES, projects: [10000.5]}
  - method: GET
    path: /badid/rest/api/3/issue/OPS-2
    json: {id: "+10011", key: OPS-2}
  # jira-badtype: the user search answers a field of the wrong type
  - method: GET
    path: /badtype/rest/api/3/user/search
    json:
      - {accountId: acc-dana, accountType: atlassian, active: "yes", emailAddress: dana@example.com, displayName: Dana}
checks:
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", want: allowed}
  - {user: DANA@example.com, action: CREATE_ISSUES, resource: "issue:OPS-1", want: allowed}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:SEC", want: denied}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:SEC-7", want: denied}
  - {user: bob@example.com, action: BROWSE_PROJECTS, resource: "issue:SEC-7", want: allowed}
  - {user: dana@example.com, action: EDIT_ISSUES, resource: "project:OPS", want: unsupported}
  - {user: dana@example.com, action: ADMINISTER, resource: global, want: allowed}
  - {user: dana@example.com, action: BULK_CHANGE, resource: global, want: denied}
  - {user: noname@example.com, action: CREATE_ISSUES, resource: "project:OPS", want: allowed}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:NOPE", want: resource_not_visible}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:NOPE-9", want: resource_not_visible}
  - {user: twin@example.com, action: CREATE_ISSUES, resource: "project:OPS", want: user_ambiguous}
  - {user: nobody@example.com, action: CREATE_ISSUES, resource: "project:OPS", want: user_not_found}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: global, want: invalid_request}
  - {user: dana@example.com, action: ADMINISTER, resource: "project:OPS", want: invalid_request}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:ops", want: invalid_request}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:OPS-0", want: invalid_request}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "board:1", want: invalid_request}
  - {user: dana@example.com, action: ADMINISTER, resource: "global:x", want: invalid_request}
  - {user: dana@example.com, action: NOT_A_KEY, resource: global, want: unknown_action}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-hidden, want: unsupported}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-crowded, want: unsupported}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-rejected, want: credential_rejected}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-noadmin, want: credential_rejected}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:OPS-1", connection: jira-noadmin, want: credential_rejected}
  - {user: dana@example.com, action: ADMINISTER, resource: global, connection: jira-badkey, want: unsupported}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-broken, want: upstream_error}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-limited, want: upstream_rate_limited}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-badid, want: upstream_error}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:OPS-1", connection: jira-badid, want: upstream_error}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "issue:OPS-2", connection: jira-badid, want: upstream_error}
  - {user: dana@example.com, action: CREATE_ISSUES, resource: "project:OPS", connection: jira-badtype, want: upstream_error}
