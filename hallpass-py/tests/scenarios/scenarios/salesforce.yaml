# The salesforce integration against a static fake of the token endpoint and
# the REST API. Every SOQL query goes to the one /query route, so each
# connection's URL carries its own path prefix and its query route answers
# every query with the same records: the fields of the User row, the
# UserLogin row, the UserRecordAccess row and the permission rows side by
# side in one record (unknown fields are ignored on both sides). The token
# response carries no instance_url, so the API base is the configured url.
# sf: client_credentials, a user with read-only access everywhere. sf-jwt:
# jwt_bearer with a throwaway test key (the same one github.yaml uses).
# sf-empty, sf-amb, sf-inactive, sf-frozen: no user, two users, an inactive
# and a frozen user. sf-forbidden, sf-limit, sf-shape, sf-broken: the query
# endpoint answers 403, 403 REQUEST_LIMIT_EXCEEDED, 400 INVALID_TYPE and
# 500. sf-badtoken: the token endpoint rejects the credential.
connections:
  - id: sf
    integration: salesforce
    url: "{{url}}/sf"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-jwt
    integration: salesforce
    url: "{{url}}/sf"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    username: hallpass@acme.example
    credential: env:SF_KEY
    api_version: v66.0
  - id: sf-byname
    integration: salesforce
    url: "{{url}}/empty"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
    match_field: Username
  - id: sf-empty
    integration: salesforce
    url: "{{url}}/empty"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-amb
    integration: salesforce
    url: "{{url}}/amb"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-inactive
    integration: salesforce
    url: "{{url}}/inactive"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-frozen
    integration: salesforce
    url: "{{url}}/frozen"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-forbidden
    integration: salesforce
    url: "{{url}}/forbidden"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-limit
    integration: salesforce
    url: "{{url}}/limit"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-shape
    integration: salesforce
    url: "{{url}}/shape"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-broken
    integration: salesforce
    url: "{{url}}/broken"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
  - id: sf-badtoken
    integration: salesforce
    url: "{{url}}/badtoken"
    ca_file: "{{ca_file}}"
    client_id: 3MVG9parity
    auth_flow: client_credentials
    credential: env:SF_SECRET
    api_version: v66.0
