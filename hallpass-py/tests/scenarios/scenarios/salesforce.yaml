upstream:
  # Token endpoints.
  - {method: POST, path: /sf/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer, scope: api}}
  - {method: POST, path: /empty/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /amb/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /inactive/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /frozen/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /forbidden/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /limit/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /shape/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /broken/services/oauth2/token, json: {access_token: parity-token, token_type: Bearer}}
  - {method: POST, path: /badtoken/services/oauth2/token, status: 400, json: {error: invalid_grant, error_description: parity}}
  # sf: one record answers every query.
  - method: GET
    path: /sf/services/data/v66.0/query
    json:
      totalSize: 1
      done: true
      records:
        - Id: 005000000000001AAA
          IsActive: true
          Username: dana@example.com
          Email: dana@example.com
          UserType: Standard
          IsFrozen: false
          RecordId: 001000000000001AAA
          HasReadAccess: true
          HasEditAccess: false
          MaxAccessLevel: Read
          PermissionsRead: true
          PermissionsEdit: false
          Parent: {IsOwnedByProfile: true, Name: Sales}
          Name: Sales
          IsOwnedByProfile: true
  - method: GET
    path: /sf/services/data/v66.0/sobjects/PermissionSet/describe
    json: {name: PermissionSet, fields: [{name: Id}, {name: PermissionsApiEnabled}]}
  - {method: GET, path: /empty/services/data/v66.0/query, json: {totalSize: 0, done: true, records: []}}
  - method: GET
    path: /amb/services/data/v66.0/query
    json:
      totalSize: 2
      done: true
      records:
        - {Id: 005000000000002AAA, IsActive: true, Username: amb@example.com, UserType: Standard}
        - {Id: 005000000000003AAA, IsActive: true, Username: amb@example.com, UserType: Standard}
  - method: GET
    path: /inactive/services/data/v66.0/query
    json: {totalSize: 1, done: true, records: [{Id: 005000000000004AAA, IsActive: false, Username: ian@example.com, UserType: Standard}]}
  - method: GET
    path: /frozen/services/data/v66.0/query
    json: {totalSize: 1, done: true, records: [{Id: 005000000000005AAA, IsActive: true, Username: fred@example.com, UserType: Standard, IsFrozen: true}]}
  - {method: GET, path: /forbidden/services/data/v66.0/query, status: 403, json: [{message: no, errorCode: INSUFFICIENT_ACCESS}]}
  - {method: GET, path: /limit/services/data/v66.0/query, status: 403, json: [{message: no, errorCode: REQUEST_LIMIT_EXCEEDED}]}
  - {method: GET, path: /shape/services/data/v66.0/query, status: 400, json: [{message: no, errorCode: INVALID_TYPE}]}
  - {method: GET, path: /broken/services/data/v66.0/query, status: 500, body: oops}
checks:
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", want: allowed}
  - {user: dana@example.com, action: record.edit, resource: "record:001000000000001AAA", want: denied}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-jwt, want: allowed}
  - {user: dana@example.com, action: object.read, resource: "object:Account", want: allowed}
  - {user: dana@example.com, action: object.edit, resource: "object:Account", want: denied}
  - {user: dana@example.com, action: field.read, resource: "field:Account.Rating", want: allowed}
  - {user: dana@example.com, action: field.edit, resource: "field:Account.Rating", want: denied}
  - {user: dana@example.com, action: system.permission, resource: "permission:PermissionsApiEnabled", want: allowed}
  - {user: dana@example.com, action: system.permission, resource: "permission:PermissionsViewSetup", want: invalid_request}
  - {user: dana@example.com, action: permset.assigned, resource: "permset:acme__Sales_Ops", want: allowed}
  - {user: dana@example.com, action: user.active, resource: "user:Dana@Example.com", want: allowed}
  - {user: dana@example.com, action: user.active, resource: "record:005000000000001AAA", want: allowed}
  - {user: dana@example.com, action: user.active, resource: "user:bob@example.com", want: invalid_request}
  - {user: dana@example.com, action: record.read, resource: "record:001", want: invalid_request}
  - {user: dana@example.com, action: object.read, resource: "object:Account' OR 1=1", want: invalid_request}
  - {user: dana@example.com, action: field.read, resource: "field:Account", want: invalid_request}
  - {user: dana@example.com, action: permset.assigned, resource: "permset:a__b__c", want: invalid_request}
  - {user: dana@example.com, action: record.create, resource: "record:001000000000001AAA", want: unknown_action}
  - {user: "o'neil@example.com", action: record.read, resource: "record:001000000000001AAA", connection: sf-empty, want: user_not_found}
  - {user: nobody@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-empty, want: user_not_found}
  - {user: nobody@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-byname, want: user_not_found}
  - {user: amb@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-amb, want: user_ambiguous}
  - {user: ian@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-inactive, want: denied}
  - {user: fred@example.com, action: object.read, resource: "object:Account", connection: sf-frozen, want: denied}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-forbidden, want: credential_rejected}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-limit, want: upstream_rate_limited}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-shape, want: unsupported}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-broken, want: upstream_error}
  - {user: dana@example.com, action: record.read, resource: "record:001000000000001AAA", connection: sf-badtoken, want: credential_rejected}
