# The snowflake integration against a static fake of the SQL API. Every
# statement is a POST to the one /api/v2/statements route, so each
# connection's URL carries its own path prefix and its route answers every
# statement with the same result set. Its one row is read by each statement
# for the columns it needs: SHOW USERS for name, login_name, email and
# disabled; SHOW GRANTS TO USER for role; SHOW GRANTS TO ROLE for privilege,
# granted_on and name. So user PROD (email dana@example.com) holds role
# ANALYST, and ANALYST and PUBLIC both hold USAGE on database PROD.
# snow: that account. snow-off, snow-unknown: the user is disabled, or its
# disabled column is empty. snow-amb: two users with the address. snow-hidden,
# snow-priv, snow-other: the statement fails with 002003, 003001 and an
# unmapped code. snow-rejected, snow-throttled, snow-broken: HTTP 401, 429
# and 500. The key is a throwaway test key (the same one github.yaml uses).
connections:
  - id: snow
    integration: snowflake
    url: "{{url}}/sf1"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-off
    integration: snowflake
    url: "{{url}}/off"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-unknown
    integration: snowflake
    url: "{{url}}/unknown"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-amb
