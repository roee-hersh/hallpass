    url: "{{url}}/amb"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-hidden
    integration: snowflake
    url: "{{url}}/hidden"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-priv
    integration: snowflake
    url: "{{url}}/priv"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-other
    integration: snowflake
    url: "{{url}}/other"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
    credential: env:SNOW_KEY
  - id: snow-rejected
    integration: snowflake
    url: "{{url}}/rejected"
    ca_file: "{{ca_file}}"
    account: myorg-myaccount
    user: hallpass
    role: secadmin
