upstream:
  - method: POST
    path: /sf1/api/v2/statements
    json:
      code: "090001"
      statementHandle: 01b0f0f0-0000-0000-0000-000000000001
      data: [[PROD, dana, dana@example.com, "false", ANALYST, PERSON, ANALYST, USAGE, DATABASE]]
      resultSetMetaData: {numRows: 1, rowType: [{name: name}, {name: login_name}, {name: email}, {name: disabled}, {name: default_role}, {name: type}, {name: role}, {name: privilege}, {name: granted_on}]}
  - method: POST
    path: /off/api/v2/statements
    json:
      data: [[PROD, dana, dana@example.com, "true", ANALYST, PERSON, ANALYST, USAGE, DATABASE]]
      resultSetMetaData: {numRows: 1, rowType: [{name: name}, {name: login_name}, {name: email}, {name: disabled}, {name: default_role}, {name: type}, {name: role}, {name: privilege}, {name: granted_on}]}
  - method: POST
    path: /unknown/api/v2/statements
    json:
      data: [[PROD, dana, dana@example.com, null, ANALYST, PERSON, ANALYST, USAGE, DATABASE]]
      resultSetMetaData: {numRows: 1, rowType: [{name: name}, {name: login_name}, {name: email}, {name: disabled}, {name: default_role}, {name: type}, {name: role}, {name: privilege}, {name: granted_on}]}
  - method: POST
    path: /amb/api/v2/statements
    json:
      data:
        - [ONE, one, dana@example.com, "false", "", PERSON, "", "", ""]
        - [TWO, two, dana@example.com, "false", "", PERSON, "", "", ""]
      resultSetMetaData: {numRows: 2, rowType: [{name: name}, {name: login_name}, {name: email}, {name: disabled}, {name: default_role}, {name: type}, {name: role}, {name: privilege}, {name: granted_on}]}
  - {method: POST, path: /hidden/api/v2/statements, status: 422, json: {code: "002003", sqlState: "02000", message: "does not exist or not authorized"}}
  - {method: POST, path: /priv/api/v2/statements, status: 422, json: {code: "003001", sqlState: "42501", message: "insufficient privileges"}}
  - {method: POST, path: /other/api/v2/statements, status: 422, json: {code: "001003", message: "syntax error"}}
  - {method: POST, path: /rejected/api/v2/statements, status: 401, json: {code: "390144", message: "JWT token is invalid."}}
  - {method: POST, path: /throttled/api/v2/statements, status: 429, json: {message: slow down}}
  - {method: POST, path: /broken/api/v2/statements, status: 500, body: oops}
checks:
  - {user: dana@example.com, action: database.usage, resource: "database:prod", want: allowed}
  - {user: Dana@Example.com, action: database.usage, resource: "database:PROD", want: allowed}
  - {user: dana@example.com, action: database.usage, resource: "database:dev", want: denied}
  - {user: dana@example.com, action: database.create_schema, resource: "database:prod", want: denied}
  - {user: dana@example.com, action: schema.usage, resource: "schema:prod.sales", want: denied}
  - {user: dana@example.com, action: table.select, resource: "table:prod.sales.orders", want: denied}
  - {user: dana@example.com, action: role.use, resource: "role:analyst", want: allowed}
  - {user: dana@example.com, action: role.use, resource: "role:public", want: allowed}
  - {user: dana@example.com, action: role.use, resource: "role:dev", want: denied}
  - {user: dana@example.com, action: account.create_database, resource: account, want: denied}
  - {user: dana@example.com, action: "raw:MONITOR", resource: "warehouse:analytics_wh", want: denied}
  - {user: dana@example.com, action: "raw:USAGE", resource: "database:prod", want: allowed}
  - {user: dana@example.com, action: "raw:USAGE", resource: "role:analyst", want: invalid_request}
  - {user: dana@example.com, action: "raw:OWNERSHIP", resource: "database:prod", want: unknown_action}
  - {user: dana@example.com, action: table.select, resource: "table:orders", want: invalid_request}
  - {user: dana@example.com, action: table.select, resource: "table:prod.sales.o;drop", want: invalid_request}
  - {user: dana@example.com, action: table.select, resource: 'table:prod.sales."a"b"', want: invalid_request}
  - {user: dana@example.com, action: account.create_database, resource: "account:x", want: invalid_request}
  - {user: nobody@example.com, action: database.usage, resource: "database:prod", want: user_not_found}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-off, want: denied}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-unknown, want: unsupported}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-amb, want: user_ambiguous}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-hidden, want: credential_rejected}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-priv, want: credential_rejected}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-other, want: upstream_error}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-rejected, want: credential_rejected}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-throttled, want: upstream_rate_limited}
  - {user: dana@example.com, action: database.usage, resource: "database:prod", connection: snow-broken, want: upstream_error}
