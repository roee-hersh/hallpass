[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hallpass-client"
# The release workflow sets the version from the release tag before it builds.
version = "0.0.0"
description = "Check with hallpass whether a user may do something before your AI agent does it for them."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai-agents", "authorization", "permissions", "llm", "tools", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/roee-hersh/hallpass"
Documentation = "https://github.com/roee-hersh/hallpass/blob/main/docs/guides/agent-tools.md"
Issues = "https://github.com/roee-hersh/hallpass/issues"
Source = "https://github.com/roee-hersh/hallpass/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/hallpass_client"]

[tool.hatch.build.targets.sdist]
include = ["src/hallpass_client", "tests", "README.md", "LICENSE"]
