[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "securetools"
version = "0.1.0.dev0"
description = "Secure-by-default tools for AI agents: authorization, scope limits, approval, untrusted-data and exfiltration guards, credential injection and audit, under any agent framework."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-agents", "security", "prompt-injection", "authorization", "llm", "tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
# User authorization answered live by the system that owns the resource.
hallpass = ["hallpass>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/securetools"]

[tool.hatch.build.targets.sdist]
include = ["src/securetools", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "A", "N", "SIM", "RUF"]
ignore = ["A001", "A002", "N818", "RUF012", "SIM105", "SIM108", "UP007", "B904"]

[tool.ruff.lint.per-file-ignores]
# Fail closed: any failure in a hook (authorizer, approver, credentials) refuses the call.
"src/securetools/_toolkit.py" = ["BLE001"]
# The tests exercise typing.Optional on purpose.
"tests/**" = ["BLE", "B011", "N802", "SIM", "UP045"]
