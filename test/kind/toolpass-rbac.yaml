# The one permission toolpass needs on a cluster: create SubjectAccessReviews.
# SubjectAccessReviews are never persisted; creating one only asks the
# API server "may this subject do that?".
apiVersion: v1
kind: Namespace
metadata:
  name: toolpass
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toolpass
  namespace: toolpass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toolpass-subjectaccessreview
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toolpass-subjectaccessreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toolpass-subjectaccessreview
subjects:
  - kind: ServiceAccount
    name: toolpass
    namespace: toolpass
