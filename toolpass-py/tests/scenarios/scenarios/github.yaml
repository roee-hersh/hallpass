upstream:
  # Installation tokens, for every connection prefix.
  - {method: POST, path: /api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /saml/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /noprov/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /gqlerr/api/v3/app/installations/42/access_tokens, status: 201, json: {token: ghs_parity, expires_at: "2099-01-01T00:00:00Z"}}
  - {method: POST, path: /nomint/api/v3/app/installations/7/access_tokens, status: 404, json: {message: Not Found}}
  - {method: GET, path: /saml/api/v3/orgs/acme/installation, json: {id: 42, permissions: {metadata: read, members: read}, account: {login: acme}}}
  # Template identities.
  - {method: GET, path: /api/v3/users/dana, json: {login: dana, type: User}}
  - {method: GET, path: /api/v3/users/bob, json: {login: bob, type: User}}
  - {method: GET, path: /api/v3/users/carol, json: {login: carol, type: User}}
  - {method: GET, path: /api/v3/users/eve, json: {login: eve, type: User}}
  - {method: GET, path: /api/v3/users/acme, json: {login: acme, type: Organization}}
  - {method: GET, path: /api/v3/users/nobody, status: 404, json: {message: Not Found}}
  # Collaborator permissions.
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/dana/permission
    json: {permission: admin, role_name: admin, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: true, admin: true}}}
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/bob/permission
    json: {permission: read, role_name: read, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/api/collaborators/carol/permission
    json: {permission: none, role_name: none, user: {login: carol, permissions: {pull: false, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/webapp/collaborators/dana/permission
    json: {permission: write, role_name: write, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/webapp/collaborators/bob/permission
    json: {permission: read, role_name: read, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - method: GET
    path: /api/v3/repos/acme/custom/collaborators/bob/permission
    json: {permission: read, role_name: security-champion, user: {login: bob, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}
  - {method: GET, path: /api/v3/repos/acme/legacy/collaborators/bob/permission, json: {permission: security-champion, role_name: "", user: {login: bob}}}
  - {method: GET, path: /api/v3/repos/acme/secret/collaborators/dana/permission, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/repos/acme/limited/collaborators/dana/permission, status: 403, headers: {X-RateLimit-Remaining: "0"}, json: {message: API rate limit exceeded}}
  - {method: GET, path: /api/v3/repos/acme/forbidden/collaborators/dana/permission, status: 403, headers: {X-RateLimit-Remaining: "4999"}, json: {message: Resource not accessible by integration}}
  - {method: GET, path: /api/v3/repos/acme/broken/collaborators/dana/permission, status: 500, json: {message: Server Error}}
  - {method: GET, path: /api/v3/repos/acme/garbled/collaborators/dana/permission, json: {permission: 7}}
  # Repository records.
  - {method: GET, path: /api/v3/repos/acme/api, json: {name: api, has_issues: true, allow_forking: true, visibility: public}}
  - {method: GET, path: /api/v3/repos/acme/webapp, json: {name: webapp, has_issues: false, allow_forking: false, visibility: private}}
  # Branch rules and protection.
  - {method: GET, path: /api/v3/repos/acme/api/rules/branches/main, json: [{type: pull_request}, {type: required_status_checks}]}
  - {method: GET, path: /api/v3/repos/acme/api/branches/main/protection, status: 404, json: {message: Branch not protected}}
  - {method: GET, path: /api/v3/repos/acme/webapp/rules/branches/main, json: []}
  - method: GET
    path: /api/v3/repos/acme/webapp/branches/main/protection
    json: {restrictions: {users: [{login: carol}], teams: [{slug: release}], apps: []}, enforce_admins: {enabled: false}}
  - {method: GET, path: /api/v3/orgs/acme/teams/release/memberships/dana, status: 404, json: {message: Not Found}}
  # Organization and teams.
  - {method: GET, path: /api/v3/orgs/acme/memberships/dana, json: {state: active, role: admin}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/bob, json: {state: active, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/eve, json: {state: pending, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/memberships/carol, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme, json: {login: acme, members_can_create_repositories: true, members_can_create_public_repositories: false, members_can_create_private_repositories: true}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform, json: {slug: platform}}
  - {method: GET, path: /api/v3/orgs/acme/teams/nope, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/dana, json: {state: active, role: maintainer}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/bob, json: {state: active, role: member}}
  - {method: GET, path: /api/v3/orgs/acme/teams/platform/memberships/carol, status: 404, json: {message: Not Found}}
  - {method: GET, path: /api/v3/orgs/acme/teams/nope/memberships/dana, status: 404, json: {message: Not Found}}
  # SAML: the userName lookup and the listing both answer this page.
  - method: POST
    path: /saml/api/graphql
    json:
      data:
        organization:
          samlIdentityProvider:
            externalIdentities:
              pageInfo: {hasNextPage: false, endCursor: ""}
              nodes:
                - {user: {login: dana}, samlIdentity: {nameId: dana@example.com, username: dana@example.com}, scimIdentity: null}
                - {user: null, samlIdentity: {nameId: ghost@example.com, username: ghost@example.com}, scimIdentity: null}
                - {user: {login: zed}, samlIdentity: {nameId: Zed@Example.com, username: zed}, scimIdentity: null}
                - {user: {login: dupone}, samlIdentity: {nameId: dup@example.com, username: dup-one}, scimIdentity: null}
                - {user: {login: duptwo}, samlIdentity: {nameId: DUP@example.com, username: dup-two}, scimIdentity: null}
  - {method: GET, path: /saml/api/v3/repos/acme/api/collaborators/dana/permission, json: {permission: admin, role_name: admin, user: {login: dana, permissions: {pull: true, triage: true, push: true, maintain: true, admin: true}}}}
  - {method: GET, path: /saml/api/v3/repos/acme/api/collaborators/zed/permission, json: {permission: read, role_name: read, user: {login: zed, permissions: {pull: true, triage: false, push: false, maintain: false, admin: false}}}}
  - {method: POST, path: /noprov/api/graphql, json: {data: {organization: {samlIdentityProvider: null}}}}
  - {method: POST, path: /gqlerr/api/graphql, json: {data: null, errors: [{type: FORBIDDEN, message: Resource not accessible by integration}]}}
checks:
  # Repository permissions.
  - {user: dana@example.com, action: repo.admin, resource: "repo:acme/api", want: allowed, reason: "allowed: dana has admin on acme/api, which includes admin"}
  - {user: dana@example.com, action: repo.read, resource: "repo:Acme/api", want: allowed, reason: "allowed: dana has admin on acme/api, which includes pull"}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/api", want: allowed, reason: "allowed: bob has read on acme/api, which includes pull"}
  - {user: bob@example.com, action: repo.push, resource: "repo:acme/api", want: denied, reason: "denied: bob has read on acme/api, which does not include push"}
  - {user: carol@example.com, action: repo.read, resource: "repo:acme/api", want: denied, reason: "denied: carol has none on acme/api, which does not include pull"}
  - {user: dana@example.com, action: repo.maintain, resource: "repo:acme/webapp", want: denied, reason: "denied: dana has write on acme/webapp, which does not include maintain"}
  - {user: bob@example.com, action: repo.push, resource: "repo:acme/custom", want: unsupported, reason: "unsupported: bob has custom repository role security-champion on acme/custom; extra abilities not modeled, so push cannot be evaluated"}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/custom", want: allowed, reason: "allowed: bob has security-champion on acme/custom, which includes pull"}
  - {user: bob@example.com, action: repo.read, resource: "repo:acme/legacy", want: unsupported, reason: "unsupported: GitHub reported permission \"security-champion\" for bob on acme/legacy, which toolpass does not model"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/secret", want: resource_not_visible, reason: "resource_not_visible: repository acme/secret is not visible to the App, or dana is not a collaborator on a private repository"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/limited", want: upstream_rate_limited, reason: "upstream_rate_limited: GitHub rate limit exhausted for the App installation"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/forbidden", want: credential_rejected, reason: "credential_rejected: the App may not read collaborator permissions on acme/forbidden (HTTP 403); check its permissions"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/broken", want: upstream_error, reason: "upstream_error: upstream returned HTTP 500"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/garbled", want: upstream_error, reason: "upstream_error: upstream call failed"}
  # Issues and pull requests.
  - {user: bob@example.com, action: issue.create, resource: "repo:acme/api", want: allowed, reason: "allowed: bob has read on acme/api, which includes pull; issues are enabled"}
  - {user: dana@example.com, action: issue.create, resource: "repo:acme/webapp", want: denied, reason: "denied: issues are disabled on acme/webapp"}
  - {user: bob@example.com, action: pr.create, resource: "repo:acme/api", want: allowed, reason: "allowed: bob has read on acme/api, which includes pull (via fork; pushing a branch to the repository itself needs push; the repository is public)"}
  - {user: bob@example.com, action: pr.create, resource: "repo:acme/webapp", want: denied, reason: "denied: forking disabled on acme/webapp; pull request needs push access, and bob has only read"}
  - {user: dana@example.com, action: pr.create, resource: "repo:acme/webapp", want: allowed, reason: "allowed: dana has write on acme/webapp, which includes pull"}
  # Branch rules and classic protection.
  - {user: dana@example.com, action: repo.push, resource: "repo:acme/api@main", want: unsupported, reason: "unsupported: dana has admin on acme/api, which includes push, but branch main requires pull requests (pull_request rule); direct push not allowed by rules"}
  - {user: dana@example.com, action: pr.merge, resource: "repo:acme/api@main", want: allowed, reason: "allowed: dana has admin on acme/api, which includes push; branch main has 2 rules (types pull_request, required_status_checks): a direct push may still be rejected"}
  - {user: dana@example.com, action: repo.push, resource: "repo:acme/webapp@main", want: denied, reason: "denied: branch main restricts pushes to listed users, teams and apps, and dana is not among them"}
  - {user: dana@example.com, action: pr.merge, resource: "repo:acme/webapp@main", want: unsupported, reason: "unsupported: dana has write on acme/webapp, which includes push, but branch main restricts pushes and dana is not among the listed users and teams; merging may be rejected"}
  - {user: bob@example.com, action: pr.merge, resource: "repo:acme/webapp@main", want: denied, reason: "denied: bob has read on acme/webapp, which does not include push"}
  # Organization and teams.
  - {user: dana@example.com, action: org.admin, resource: "org:acme", want: allowed, reason: "allowed: dana is an owner of organization acme"}
  - {user: bob@example.com, action: org.member, resource: "org:ACME", want: allowed, reason: "allowed: bob is an active member of organization acme"}
  - {user: bob@example.com, action: org.admin, resource: "org:acme", want: denied, reason: "denied: bob is a member of organization acme, not an owner"}
  - {user: eve@example.com, action: org.member, resource: "org:acme", want: denied, reason: "denied: eve's membership in organization acme is pending, not active"}
  - {user: carol@example.com, action: org.member, resource: "org:acme", want: denied, reason: "denied: carol is not a member of organization acme"}
  - {user: bob@example.com, action: org.repo.create, resource: "org:acme", want: allowed, reason: "allowed: bob is a member of organization acme, whose members may create repositories (private)"}
  - {user: dana@example.com, action: team.maintainer, resource: "team:acme/platform", want: allowed, reason: "allowed: dana is a maintainer of team acme/platform"}
  - {user: bob@example.com, action: team.member, resource: "team:acme/platform", want: allowed, reason: "allowed: bob is an active member of team acme/platform"}
  - {user: bob@example.com, action: team.maintainer, resource: "team:acme/platform", want: denied, reason: "denied: bob is a member of team acme/platform, not a maintainer"}
  - {user: carol@example.com, action: team.member, resource: "team:acme/platform", want: denied, reason: "denied: carol is not a member of team acme/platform"}
  - {user: dana@example.com, action: team.member, resource: "team:acme/nope", want: resource_not_visible, reason: "resource_not_visible: team acme/nope does not exist or is not visible to the App"}
  # Template identities and request validation.
  - {user: nobody@example.com, action: repo.read, resource: "repo:acme/api", want: user_not_found, reason: "user_not_found: no GitHub user nobody (from login_template) for nobody@example.com"}
  - {user: acme@example.com, action: repo.read, resource: "repo:acme/api", want: user_not_found, reason: "user_not_found: acme (from login_template) is a GitHub organization, not a user"}
  - {user: dana@other.example, action: repo.read, resource: "repo:acme/api", want: unsupported, reason: "unsupported: email domain other.example is not in email_domains; login_template is not applied to it"}
  - {user: dana@example.com, action: repo.read, resource: "repo:other/api", want: invalid_request, reason: "invalid_request: repository owner \"other\" must be the configured organization \"acme\": the app installation is per organization"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api@a..b", want: invalid_request, reason: "invalid_request: branch \"a..b\" is not a valid branch name"}
  - {user: dana@example.com, action: team.member, resource: "team:acme/Platform", want: invalid_request, reason: "invalid_request: team resource must be team:<org>/<slug>, got \"acme/Platform\""}
  - {user: dana@example.com, action: repo.read, resource: "org:acme", want: invalid_request, reason: "invalid_request: action repo.read needs a repo: resource, not org:"}
  - {user: dana@example.com, action: repo.delete, resource: "repo:acme/api", want: unknown_action, reason: "unknown_action: integration github has no action \"repo.delete\""}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-nomint, want: credential_rejected, reason: "credential_rejected: installation 7 was not found for this App"}
  # SAML identities.
  - {user: dana@example.com, action: repo.admin, resource: "repo:acme/api", connection: github-saml, want: allowed, reason: "allowed: dana has admin on acme/api, which includes admin"}
  - {user: zed@example.com, action: repo.push, resource: "repo:acme/api", connection: github-saml, want: denied, reason: "denied: zed has read on acme/api, which does not include push"}
  - {user: ghost@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: unsupported, reason: "unsupported: SAML identity for ghost@example.com is not linked to a GitHub account"}
  - {user: dup@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: user_ambiguous, reason: "user_ambiguous: SAML identity dup@example.com is linked to several GitHub accounts"}
  - {user: nobody@example.com, action: repo.read, resource: "repo:acme/api", connection: github-saml, want: user_not_found, reason: "user_not_found: no SAML identity in acme for nobody@example.com"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-noprov, want: unsupported, reason: "unsupported: organization has no SAML identity provider; use identity_mode template or map_file"}
  - {user: dana@example.com, action: repo.read, resource: "repo:acme/api", connection: github-gqlerr, want: credential_rejected, reason: "credential_rejected: the App may not read organization SAML identities (GraphQL FORBIDDEN); it needs Organization members: read"}
