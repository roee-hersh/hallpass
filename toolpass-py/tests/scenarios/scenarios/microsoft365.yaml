# microsoft365: Microsoft Graph with the client credentials grant, both
# endpoints (authority_url and url) pointed at the fake upstream.
connections:
  - id: m365
    integration: microsoft365
    tenant_id: 11111111-1111-1111-1111-111111111111
    client_id: 22222222-2222-2222-2222-222222222222
    credential: env:HP_PARITY_M365_SECRET
    authority_url: "{{url}}"
    url: "{{url}}"
    ca_file: "{{ca_file}}"
  # A second Graph base under the same fake, whose user filter finds two users.
  - id: m365-amb
    integration: microsoft365
    tenant_id: 11111111-1111-1111-1111-111111111111
    client_id: 22222222-2222-2222-2222-222222222222
    credential: env:HP_PARITY_M365_SECRET
    authority_url: "{{url}}"
    url: "{{url}}/amb"
    ca_file: "{{ca_file}}"
  # A tenant whose token endpoint rejects the client.
  - id: m365-badcred
    integration: microsoft365
    tenant_id: contoso.onmicrosoft.com
    client_id: 22222222-2222-2222-2222-222222222222
    credential: env:HP_PARITY_M365_SECRET
    authority_url: "{{url}}"
    url: "{{url}}"
    ca_file: "{{ca_file}}"
env:
  HP_PARITY_M365_SECRET: s3cret
upstream:
  - {method: POST, path: /11111111-1111-1111-1111-111111111111/oauth2/v2.0/token, json: {access_token: tok, token_type: Bearer, expires_in: 3599}}
  - {method: POST, path: /contoso.onmicrosoft.com/oauth2/v2.0/token, status: 401, json: {error: invalid_client, error_description: bad secret}}
  - method: GET
    path: /v1.0/users/dana@example.com
    json: {id: aaaaaaaa-0000-0000-0000-000000000001, userPrincipalName: dana@example.com, mail: dana@example.com, accountEnabled: true, userType: Member}
  - method: GET
    path: /v1.0/users/bob@example.com
    json: {id: aaaaaaaa-0000-0000-0000-000000000002, userPrincipalName: bob@example.com, mail: bob@example.com, accountEnabled: true, userType: Member}
  - method: GET
    path: /v1.0/users/guest@example.com
    json: {id: aaaaaaaa-0000-0000-0000-000000000003, userPrincipalName: "guest_gmail.com#EXT#@example.onmicrosoft.com", mail: guest@example.com, accountEnabled: true, userType: Guest}
  - method: GET
    path: /v1.0/users/off@example.com
    json: {id: aaaaaaaa-0000-0000-0000-000000000004, userPrincipalName: off@example.com, mail: off@example.com, accountEnabled: false, userType: Member}
  - method: GET
    path: /v1.0/users/nostate@example.com
    json: {id: aaaaaaaa-0000-0000-0000-000000000005, userPrincipalName: nostate@example.com, mail: nostate@example.com, userType: Member}
  # The mail and proxyAddresses filters find nobody (nobody@example.com has no
  # direct route, so its lookup answers 404 first).
  - {method: GET, path: /v1.0/users, json: {value: []}}
  - method: GET
    path: /amb/v1.0/users
    json:
      value:
        - {id: aaaaaaaa-0000-0000-0000-000000000001, userPrincipalName: dana@example.com, accountEnabled: true}
        - {id: aaaaaaaa-0000-0000-0000-000000000002, userPrincipalName: bob@example.com, accountEnabled: true}
  - {method: GET, path: /v1.0/groups/bbbbbbbb-0000-0000-0000-000000000001, json: {id: bbbbbbbb-0000-0000-0000-000000000001, visibility: Private}}
  - {method: GET, path: /v1.0/groups/bbbbbbbb-0000-0000-0000-000000000003, json: {id: bbbbbbbb-0000-0000-0000-000000000003, visibility: HiddenMembership}}
  - {method: GET, path: /v1.0/groups/bbbbbbbb-0000-0000-0000-000000000099, status: 404, json: {error: {code: Request_ResourceNotFound, message: gone}}}
  - {method: POST, path: /v1.0/users/aaaaaaaa-0000-0000-0000-000000000001/checkMemberGroups, json: {value: [bbbbbbbb-0000-0000-0000-000000000001]}}
  - {method: POST, path: /v1.0/users/aaaaaaaa-0000-0000-0000-000000000002/checkMemberGroups, json: {value: []}}
  - {method: GET, path: /v1.0/users/aaaaaaaa-0000-0000-0000-000000000001/transitiveMemberOf/microsoft.graph.directoryRole, json: {value: [{roleTemplateId: cccccccc-0000-0000-0000-000000000001}]}}
  - method: GET
    path: /v1.0/users/aaaaaaaa-0000-0000-0000-000000000002/transitiveMemberOf/microsoft.graph.directoryRole
    status: 403
    json: {error: {code: Authorization_RequestDenied, message: denied}}
  - method: GET
    path: /v1.0/teams/dddddddd-0000-0000-0000-000000000001/members
    json:
      value:
        - {userId: aaaaaaaa-0000-0000-0000-000000000001, roles: [owner]}
        - {userId: aaaaaaaa-0000-0000-0000-000000000002, roles: []}
  - {method: GET, path: /v1.0/teams/dddddddd-0000-0000-0000-000000000002/members, status: 500, json: {error: {code: InternalServerError, message: boom}}}
  - {method: GET, path: /v1.0/teams/dddddddd-0000-0000-0000-000000000003/members, status: 429, headers: {Retry-After: "30"}, json: {error: {code: TooManyRequests, message: slow}}}
  - {method: GET, path: "/v1.0/teams/dddddddd-0000-0000-0000-000000000001/channels/19:priv@thread.tacv2", json: {id: "19:priv@thread.tacv2", membershipType: private}}
  - {method: GET, path: "/v1.0/teams/dddddddd-0000-0000-0000-000000000001/channels/19:priv@thread.tacv2/members", json: {value: [{userId: aaaaaaaa-0000-0000-0000-000000000001, roles: []}]}}
  - {method: GET, path: "/v1.0/teams/dddddddd-0000-0000-0000-000000000001/channels/19:odd@thread.tacv2", json: {id: "19:odd@thread.tacv2", membershipType: unknownFutureValue}}
  - method: GET
    path: "/v1.0/drives/b!drive1/items/item1/permissions"
    json:
      value:
        - {roles: [read], grantedToV2: {user: {id: aaaaaaaa-0000-0000-0000-000000000001}}}
        - {roles: [write], link: {scope: organization}}
  - method: GET
    path: "/v1.0/drives/b!drive1/items/item2/permissions"
    json:
      value:
        - {roles: [read], link: {scope: existingAccess}}
  - {method: GET, path: "/v1.0/drives/b!drive1", json: {id: "b!drive1"}}
checks:
  - {user: dana@example.com, action: user.active, resource: "user:dana@example.com", want: allowed, reason: "allowed: dana@example.com: account enabled"}
  - {user: dana@example.com, action: user.active, resource: "user:bob@example.com", want: unsupported, reason: "unsupported: user.active is evaluated for the caller's own account only; bob@example.com is another account"}
  - {user: off@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", want: denied, reason: "denied: off@example.com: account disabled"}
  - {user: nostate@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", want: unsupported, reason: "unsupported: nostate@example.com: Graph did not report whether the account is enabled"}
  - {user: nobody@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", want: user_not_found, reason: "user_not_found: no Entra user has nobody@example.com as UPN, mail or proxy address"}
  - {user: shared@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", connection: m365-amb, want: user_ambiguous, reason: "user_ambiguous: 2 Entra users match shared@example.com"}
  - {user: dana@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", want: allowed, reason: "allowed: dana@example.com is a transitive member of group bbbbbbbb-0000-0000-0000-000000000001"}
  - {user: bob@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", want: denied, reason: "denied: bob@example.com is not a member of group bbbbbbbb-0000-0000-0000-000000000001"}
  - {user: guest@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000003", want: resource_not_visible, reason: "resource_not_visible: user aaaaaaaa-0000-0000-0000-000000000003 was not found or is not visible to toolpass"}
  - {user: bob@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000003", want: unsupported, reason: "unsupported: group bbbbbbbb-0000-0000-0000-000000000003 has hidden membership; checkMemberGroups omits it without Member.Read.Hidden, so bob@example.com's membership is unknown"}
  - {user: dana@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000099", want: resource_not_visible, reason: "resource_not_visible: group bbbbbbbb-0000-0000-0000-000000000099 was not found or is not visible to toolpass"}
  - {user: dana@example.com, action: group.member, resource: "group:not-a-guid", want: invalid_request, reason: "invalid_request: group: id must be a GUID"}
  - {user: dana@example.com, action: role.member, resource: "role:CCCCCCCC-0000-0000-0000-000000000001", want: allowed, reason: "allowed: dana@example.com holds directory role template CCCCCCCC-0000-0000-0000-000000000001"}
  - {user: bob@example.com, action: role.member, resource: "role:cccccccc-0000-0000-0000-000000000001", want: credential_rejected, reason: "credential_rejected: reading directory roles needs RoleManagement.Read.Directory"}
  - {user: dana@example.com, action: team.owner, resource: "team:dddddddd-0000-0000-0000-000000000001", want: allowed, reason: "allowed: dana@example.com owns team dddddddd-0000-0000-0000-000000000001"}
  - {user: bob@example.com, action: team.owner, resource: "team:dddddddd-0000-0000-0000-000000000001", want: denied, reason: "denied: bob@example.com is a member but not an owner of team dddddddd-0000-0000-0000-000000000001"}
  - {user: bob@example.com, action: team.member, resource: "team:dddddddd-0000-0000-0000-000000000001", want: allowed, reason: "allowed: bob@example.com is a member of team dddddddd-0000-0000-0000-000000000001"}
  - {user: bob@example.com, action: team.member, resource: "team:dddddddd-0000-0000-0000-000000000002", want: upstream_error, reason: "upstream_error: upstream returned HTTP 500"}
  - {user: bob@example.com, action: team.member, resource: "team:dddddddd-0000-0000-0000-000000000003", want: upstream_rate_limited, reason: "upstream_rate_limited: rate limited by the upstream system"}
  - {user: bob@example.com, action: team.member, resource: "team:dddddddd-0000-0000-0000-000000000009", want: resource_not_visible, reason: "resource_not_visible: team dddddddd-0000-0000-0000-000000000009 was not found or is not visible to toolpass"}
  - {user: dana@example.com, action: channel.read, resource: "team:dddddddd-0000-0000-0000-000000000001/channel/19:priv@thread.tacv2", want: allowed, reason: "allowed: dana@example.com is a member of channel 19:priv@thread.tacv2 of team dddddddd-0000-0000-0000-000000000001 (private channel)"}
  - {user: bob@example.com, action: channel.read, resource: "team:dddddddd-0000-0000-0000-000000000001/channel/19:priv@thread.tacv2", want: denied, reason: "denied: bob@example.com is not a member of channel 19:priv@thread.tacv2 of team dddddddd-0000-0000-0000-000000000001 (private channel)"}
  - {user: bob@example.com, action: channel.read, resource: "team:dddddddd-0000-0000-0000-000000000001/channel/19:odd@thread.tacv2", want: unsupported, reason: "unsupported: channel 19:odd@thread.tacv2 has membership type \"unknownFutureValue\", which toolpass does not model"}
  - {user: dana@example.com, action: file.read, resource: "drive:b!drive1/item/item1", want: allowed, reason: "allowed: dana@example.com may read item item1 in drive b!drive1: granted directly"}
  - {user: bob@example.com, action: file.edit, resource: "drive:b!drive1/item/item1", want: allowed, reason: "allowed: bob@example.com may edit item item1 in drive b!drive1 via an organization-wide sharing link"}
  - {user: guest@example.com, action: file.read, resource: "drive:b!drive1/item/item1", want: denied, reason: "denied: no permission on item item1 in drive b!drive1 is granted to guest_gmail.com#EXT#@example.onmicrosoft.com (guest account) or a group they belong to; its organization-wide sharing link is not usable by guest accounts"}
  - {user: dana@example.com, action: file.share, resource: "drive:b!drive1/item/item1", want: unsupported, reason: "unsupported: dana@example.com has write access to item item1 in drive b!drive1 but is not an owner; sharing rights depend on site settings"}
  - {user: dana@example.com, action: file.read, resource: "drive:b!drive1/item/item2", want: unsupported, reason: "unsupported: item item2 in drive b!drive1 has a sharing link with scope \"existingAccess\", which toolpass does not model; dana@example.com's access is unknown"}
  - {user: dana@example.com, action: file.read, resource: "drive:b!drive1/item/missing", want: resource_not_visible, reason: "resource_not_visible: item missing in drive b!drive1 was not found or is not visible to toolpass"}
  - {user: dana@example.com, action: mail.send_as_self, resource: "mailbox:Dana@Example.com", want: allowed, reason: "allowed: dana@example.com may send from their own mailbox"}
  - {user: dana@example.com, action: mail.send_as, resource: "mailbox:bob@example.com", want: unsupported, reason: "unsupported: Send As, Send on Behalf and Full Access are Exchange delegations with no Graph API; toolpass cannot evaluate mail.send_as on mailbox bob@example.com"}
  - {user: dana@example.com, action: calendar.write, resource: "mailbox:bob@example.com", want: unsupported, reason: "unsupported: calendar delegation and folder permissions have no application-permission Graph API; toolpass cannot evaluate calendar.write on mailbox bob@example.com"}
  - {user: dana@example.com, action: group.member, resource: "group:bbbbbbbb-0000-0000-0000-000000000001", connection: m365-badcred, want: credential_rejected, reason: "credential_rejected: the token endpoint rejected toolpass's credential (invalid_client)"}
